            deleteButton.textContent =
                "🗑️";


            actions.appendChild(
                renameButton
            );

            actions.appendChild(
                deleteButton
            );

            item.appendChild(
                title
            );

            item.appendChild(
                actions
            );


            item.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(
                            ".sidebar-chat"
                        )
                        .forEach(
                            function (
                                chatItem
                            ) {

                                chatItem.classList.remove(
                                    "active"
                                );
                            }
                        );


                    item.classList.add(
                        "active"
                    );


                    openHistoryChat(
                        chat
                    );


                    sidebar.classList.remove(
                        "open"
                    );
                }
            );


            renameButton.addEventListener(
                "click",
                async function (
                    event
                ) {

                    event.preventDefault();

                    event.stopPropagation();


                    const newName =
                        prompt(
                            "Chat ka naya naam:",
                            currentTitle
                        );


                    if (
                        newName === null
                    ) {
                        return;
                    }


                    const trimmedName =
                        newName.trim();


                    if (
                        !trimmedName
                    ) {

                        alert(
                            "Naam empty nahi ho sakta."
                        );

                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/history/${realIndex}/rename`,
                                {
                                    method:
                                        "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    credentials:
                                        "include",

                                    body:
                                        JSON.stringify({
                                            title:
                                                trimmedName
                                        })
                                }
                            );


                        const result =
                            await response.json();


                        if (
                            !response.ok
                        ) {

                            throw new Error(
                                result.error ||
                                "Rename failed"
                            );
                        }


                        await showSidebar();


                    } catch (error) {

                        alert(
                            "Rename nahi hua: " +
                            error.message
                        );
                    }
                }
            );


            deleteButton.addEventListener(
                "click",
                async function (
                    event
                ) {

                    event.preventDefault();

                    event.stopPropagation();


                    const confirmDelete =
                        confirm(
                            "Kya ye chat delete karni hai?"
                        );


                    if (
                        !confirmDelete
                    ) {
                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/history/${realIndex}`,
                                {
                                    method:
                                        "DELETE",

                                    credentials:
                                        "include"
                                }
                            );


                        const result =
                            await response.json();


                        if (
                            !response.ok
                        ) {

                            throw new Error(
                                result.error ||
                                "Delete failed"
                            );
                        }


                        await showSidebar();


                    } catch (error) {

                        alert(
                            "Chat delete nahi hui: " +
                            error.message
                        );
                    }
                }
            );


            sidebarHistory.appendChild(
                item
            );
        }


        /* =========================
           HISTORY SEARCH
        ========================= */

        historySearch.addEventListener(
            "input",
            function () {

                const searchText =
                    historySearch.value
                        .toLowerCase()
                        .trim();


                document
                    .querySelectorAll(
                        ".sidebar-chat"
                    )
                    .forEach(
                        function (
                            chatItem
                        ) {

                            const text =
                                chatItem.innerText
                                    .toLowerCase();


                            chatItem.style.display =
                                text.includes(
                                    searchText
                                )
                                    ? "flex"
                                    : "none";
                        }
                    );
            }
        );


        clearHistorySearch.addEventListener(
            "click",
            function () {

                historySearch.value =
                    "";

                document
                    .querySelectorAll(
                        ".sidebar-chat"
                    )
                    .forEach(
                        function (
                            chatItem
                        ) {

                            chatItem.style.display =
                                "flex";
                        }
                    );
            }
        );


        /* =========================
           ATTACHMENT MENU
        ========================= */

        attachButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                const isOpen =
                    attachMenu.classList.toggle(
                        "open"
                    );

                attachMenu.setAttribute(
                    "aria-hidden",
                    String(
                        !isOpen
                    )
                );
            }
        );


        uploadFilesOption.addEventListener(
            "click",
            function () {

                attachMenu.classList.remove(
                    "open"
                );

                attachMenu.setAttribute(
                    "aria-hidden",
                    "true"
                );

                fileInput.click();
            }
        );


        document.addEventListener(
            "click",
            function (event) {

                if (
                    !event.target.closest(
                        ".attach-wrap"
                    )
                ) {

                    attachMenu.classList.remove(
                        "open"
                    );

                    attachMenu.setAttribute(
                        "aria-hidden",
                        "true"
                    );
                }
            }
        );


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    attachMenu.classList.remove(
                        "open"
                    );

                    attachMenu.setAttribute(
                        "aria-hidden",
                        "true"
                    );
                }
            }
        );


        /* =========================
           FILE INPUT
        ========================= */

        fileInput.addEventListener(
            "change",
            function () {

                const file =
                    fileInput.files &&
                    fileInput.files[0];


                if (!file) {

                    selectedAttachment =
                        null;

                    selectedFile.style.display =
                        "none";

                    selectedFile.textContent =
                        "";

                    return;
                }


                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    selectedAttachment =
                        null;

                    fileInput.value =
                        "";

                    selectedFile.style.display =
                        "block";

                    selectedFile.textContent =
                        "⚠️ Abhi sirf image files supported hain.";

                    return;
                }


                if (
                    file.size >
                    8 * 1024 * 1024
                ) {

                    selectedAttachment =
                        null;

                    fileInput.value =
                        "";

                    selectedFile.style.display =
                        "block";

                    selectedFile.textContent =
                        "⚠️ Image 8 MB se chhoti honi chahiye.";

                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function () {

                        const dataUrl =
                            String(
                                reader.result ||
                                ""
                            );


                        selectedAttachment =
                            {
                                name:
                                    file.name,

                                mimeType:
                                    file.type,

                                dataUrl:
                                    dataUrl
                            };


                        selectedFile.textContent =
                            "📎 " +
                            file.name;

                        selectedFile.style.display =
                            "block";
                    };


                reader.onerror =
                    function () {

                        selectedAttachment =
                            null;

                        selectedFile.style.display =
                            "block";

                        selectedFile.textContent =
                            "⚠️ Image read nahi ho paayi.";
                    };


                reader.readAsDataURL(
                    file
                );
            }
        );


        /* =========================
           BUTTON EVENTS
        ========================= */

        sendButton.addEventListener(
            "click",
            function () {
                sendMessage();
            }
        );


        stopButton.addEventListener(
            "click",
            function () {
                stopGeneration();
            }
        );


        newChatButton.addEventListener(
            "click",
            function () {
                newChat();
            }
        );


        sidebarNewChat.addEventListener(
            "click",
            function () {
                newChat();
            }
        );


        historyButton.addEventListener(
            "click",
            function () {
                showSidebar();
            }
        );


        closeSidebar.addEventListener(
            "click",
            function () {

                sidebar.classList.remove(
                    "open"
                );
            }
        );


        /* =========================
           ENTER KEY
        ========================= */

        messageInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();
                }
            }
        );


        /* =========================
           START
        ========================= */

        updateAuthMode();

        checkLoginStatus();

        messageInput.focus();

    </script>

</body>

</html>
