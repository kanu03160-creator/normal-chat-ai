<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Normal Chat AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #fff;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 72px;
            width: 100%;
            background: #111;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            color: #fff;
            font-size: 24px;
            font-weight: 600;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header button {
            border: 1px solid #333;
            background: #1b1b1b;
            color: #eee;
            padding: 10px 15px;
            border-radius: 9px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .header button:hover {
            background: #292929;
            border-color: #444;
        }

        .header button:active {
            transform: scale(0.97);
        }

        #loginButton {
            background: #f1f1f1;
            color: #111;
            border-color: #f1f1f1;
            font-weight: 600;
        }

        #loginButton:hover {
            background: #fff;
        }

        /* =========================
           CHAT BOX
        ========================= */

        .chat-box {
            height: calc(100vh - 144px);
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px;
            background: #000 !important;
            color: #fff !important;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #000;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            width: fit-content;
            max-width: 78%;
            margin-bottom: 16px;
            padding: 13px 16px;
            border-radius: 14px;
            line-height: 1.55;
            font-size: 15px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message b {
            font-size: 13px;
            opacity: 0.85;
        }

        .user {
            margin-left: auto;
            margin-right: 0;
            background: #262626;
            color: #fff;
            border: 1px solid #333;
            border-bottom-right-radius: 5px;
        }

        .bot {
            margin-left: 0;
            margin-right: auto;
            background: #151515;
            color: #f5f5f5;
            border: 1px solid #252525;
            border-bottom-left-radius: 5px;
        }

        /* =========================
           TYPING
        ========================= */

        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: #888;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            height: 72px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: #000 !important;
            border-top: 1px solid #1f1f1f;
            position: relative;
        }

        #message {
            flex: 1;
            min-width: 0;
            height: 50px;
            border: 1px solid #333;
            border-radius: 13px;
            padding: 0 16px;
            font-size: 16px;
            outline: none;
            background: #171717 !important;
            color: #fff !important;
        }

        #message::placeholder {
            color: #777;
        }

        #message:focus {
            border-color: #555;
            background: #1b1b1b !important;
        }

        /* =========================
           ATTACHMENT
        ========================= */

        #attachButton {
            height: 50px;
            width: 50px;
            min-width: 50px;
            border: 1px solid #333;
            border-radius: 50%;
            background: #222;
            color: #fff;
            font-size: 30px;
            font-weight: 300;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 0 3px 0;
        }

        #attachButton:hover {
            background: #2d2d2d;
        }

        .attach-wrap {
            position: relative;
            flex: 0 0 auto;
        }

        .attach-menu {
            position: absolute;
            left: 0;
            bottom: 60px;
            width: 250px;
            padding: 8px;
            border: 1px solid #303030;
            border-radius: 14px;
            background: #171717;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
            display: none;
            z-index: 3000;
        }

        .attach-menu.open {
            display: block;
            animation: attachMenuIn 0.14s ease-out;
        }

        @keyframes attachMenuIn {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .attach-menu-item {
            width: 100%;
            min-height: 52px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #f5f5f5;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 11px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
        }

        .attach-menu-item:hover {
            background: #292929;
        }

        .attach-menu-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex: 0 0 34px;
        }

        .attach-menu-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .attach-menu-title {
            font-weight: 600;
        }

        .attach-menu-subtitle {
            color: #888;
            font-size: 12px;
        }

        #fileInput {
            display: none;
        }

        .message-attachment-image {
            display: block;
            max-width: min(420px, 100%);
            max-height: 320px;
            margin: 4px 0 10px 0;
            border-radius: 12px;
            border: 1px solid #333;
            object-fit: contain;
            background: #111;
        }

        #selectedFile {
            display: none;
            position: absolute;
            bottom: 78px;
            left: 16px;
            max-width: min(420px, calc(100vw - 32px));
            padding: 8px 12px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #171717;
            color: #ddd;
            font-size: 13px;
            z-index: 50;
        }

        /* =========================
           VOICE
        ========================= */

        #micButton {
            height: 50px;
            width: 50px;
            min-width: 50px;
            border: 1px solid #333;
            border-radius: 50%;
            background: #222;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        #micButton:hover {
            background: #2d2d2d;
        }

        #micButton:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* =========================
           SEND / STOP
        ========================= */

        #sendButton {
            height: 50px;
            width: 82px;
            min-width: 82px;
            border: 1px solid #333;
            border-radius: 13px;
            background: #f1f1f1;
            color: #111;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #fff;
        }

        #sendButton:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #stopButton {
            display: none;
            height: 50px;
            min-width: 82px;
            padding: 0 15px;
            border: 1px solid #444;
            border-radius: 13px;
            background: #1b1b1b;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        #stopButton:hover {
            background: #292929;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 370px;
            max-width: 90vw;
            height: 100vh;
            padding: 18px;
            background: #111;
            color: #fff;
            border-right: 1px solid #2a2a2a;
            box-shadow: 10px 0 35px rgba(0, 0, 0, 0.45);
            z-index: 2000;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            overflow-y: auto;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            font-size: 21px;
        }

        #closeSidebar {
            width: 36px;
            height: 36px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1b1b1b;
            color: #bbb;
            font-size: 21px;
            cursor: pointer;
        }

        #closeSidebar:hover {
            background: #292929;
            color: #fff;
        }

        .sidebar-new-chat {
            width: 100%;
            padding: 13px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #f1f1f1;
            color: #111;
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
        }

        #historySearch {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #333;
            border-radius: 10px;
            outline: none;
            margin-bottom: 8px;
            font-size: 14px;
            background: #1a1a1a;
            color: #fff;
        }

        #historySearch::placeholder {
            color: #777;
        }

        #clearHistorySearch {
            width: 100%;
            height: 40px;
            border: 1px solid #333;
            border-radius: 9px;
            background: #1a1a1a;
            color: #bbb;
            cursor: pointer;
            margin-bottom: 15px;
        }

        #sidebarHistory > p {
            color: #777;
            font-size: 14px;
            padding: 5px;
        }

        .sidebar-chat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 11px;
            margin-bottom: 8px;
            min-height: 50px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: #1a1a1a;
            color: #ddd;
            cursor: pointer;
        }

        .sidebar-chat:hover {
            background: #242424;
            border-color: #333;
        }

        .sidebar-chat.active {
            background: #292929;
            border-color: #444;
            color: #fff;
        }

        .sidebar-chat-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .sidebar-actions {
            display: flex;
            gap: 3px;
        }

        .sidebar-rename,
        .sidebar-delete {
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            border-radius: 7px;
        }

        .sidebar-rename:hover,
        .sidebar-delete:hover {
            background: #333;
            color: #fff;
        }

        /* =========================
           LOGIN MODAL
        ========================= */

        .login-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 9999;
        }

        .login-box {
            width: 380px;
            max-width: 100%;
            background: #151515;
            padding: 30px;
            border: 1px solid #303030;
            border-radius: 17px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
            position: relative;
            text-align: center;
        }

        .login-box h2 {
            color: #fff;
            margin: 0 0 25px;
            font-size: 23px;
        }

        .login-box input {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            margin-bottom: 13px;
            border: 1px solid #363636;
            border-radius: 9px;
            background: #202020;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .auth-submit {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 9px;
            background: #f1f1f1;
            color: #111;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-submit:disabled {
            opacity: 0.5;
        }

        .close-login {
            position: absolute;
            top: 11px;
            right: 13px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 25px;
            cursor: pointer;
        }

        .close-login:hover {
            background: #292929;
            color: #fff;
        }

        .auth-switch {
            color: #888;
            font-size: 14px;
        }

        .auth-switch button {
            border: none;
            background: none;
            color: #fff;
            cursor: pointer;
            text-decoration: underline;
        }

        #authMessage {
            min-height: 20px;
            color: #bbb;
        }

        /* =========================
           SETTINGS MODAL
        ========================= */

        .settings-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 9998;
        }

        .settings-box {
            width: 420px;
            max-width: 100%;
            background: #151515;
            border: 1px solid #303030;
            border-radius: 17px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
            position: relative;
        }

        .settings-box h2 {
            margin: 0 0 25px;
            font-size: 23px;
        }

        .settings-section {
            background: #1c1c1c;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .settings-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .settings-username {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        .logout-button {
            width: 100%;
            height: 46px;
            border: 1px solid #444;
            border-radius: 9px;
            background: #242424;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .logout-button:hover {
            background: #303030;
        }

        .close-settings {
            position: absolute;
            top: 11px;
            right: 13px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 25px;
            cursor: pointer;
        }

        .close-settings:hover {
            background: #292929;
            color: #fff;
        }

        /* =========================
           MESSAGE ACTIONS
        ========================= */

        .message-actions {
            display: flex;
            gap: 6px;
            margin-top: 9px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .message.bot:hover .message-actions,
        .message.user:hover .message-actions,
        .message-actions:focus-within {
            opacity: 1;
        }

        .message-action {
            border: 1px solid #333;
            background: #1b1b1b;
            color: #aaa;
            border-radius: 7px;
            padding: 5px 9px;
            font-size: 12px;
            cursor: pointer;
        }

        .message-action:hover {
            background: #292929;
            color: #fff;
        }

        .message-action:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .message-content {
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message-content h1,
        .message-content h2,
        .message-content h3 {
            margin: 8px 0;
        }

        .message-content p {
            margin: 0 0 10px;
        }

        .message-content ul,
        .message-content ol {
            margin: 6px 0 10px 22px;
            padding: 0;
        }

        .message-content li {
            margin: 4px 0;
        }

        .message-content code {
            background: #222;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 2px 5px;
            font-family: Consolas, monospace;
            font-size: 0.92em;
        }

        .message-content pre {
            position: relative;
            margin: 10px 0;
            padding: 14px;
            padding-top: 38px;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 10px;
            overflow-x: auto;
        }

        .message-content pre code {
            display: block;
            background: transparent;
            border: none;
            padding: 0;
            white-space: pre;
        }

        .code-copy-button {
            position: absolute;
            top: 7px;
            right: 7px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1b1b1b;
            color: #bbb;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 11px;
        }

        .code-copy-button:hover {
            background: #292929;
            color: #fff;
        }

        .edit-message-input {
            width: 100%;
            box-sizing: border-box;
            resize: vertical;
            min-height: 70px;
            padding: 10px 12px;
            margin-top: 6px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #171717;
            color: #fff;
            font: inherit;
            outline: none;
        }

        .edit-message-input:focus {
            border-color: #666;
        }

        .edit-message-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                height: 64px;
                padding: 0 9px;
            }

            .header h1 {
                font-size: 19px;
            }

            .header-buttons {
                gap: 4px;
            }

            .header button {
                padding: 8px;
                font-size: 11px;
            }

            .chat-box {
                height: calc(100vh - 128px);
                padding: 13px 9px;
            }

            .message {
                max-width: 92%;
                padding: 10px 12px;
                font-size: 14px;
            }

            .input-area {
                height: 64px;
                padding: 8px;
                gap: 6px;
            }

            #message {
                height: 48px;
                font-size: 15px;
            }

            #attachButton,
            #micButton {
                width: 48px;
                min-width: 48px;
                height: 48px;
            }

            #sendButton,
            #stopButton {
                width: 65px;
                min-width: 65px;
                height: 48px;
                padding: 0 8px;
                font-size: 13px;
            }

            .sidebar {
                width: 88vw;
                max-width: 340px;
            }

            .settings-box {
                width: calc(100vw - 30px);
                padding: 25px 18px;
            }
        }

        @media (max-width: 380px) {

            .header h1 {
                font-size: 17px;
            }

            .header button {
                padding: 7px 6px;
                font-size: 10px;
            }

            #attachButton,
            #micButton {
                width: 44px;
                min-width: 44px;
                height: 44px;
            }

            #sendButton,
            #stopButton {
                width: 58px;
                min-width: 58px;
                padding: 0 5px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================= -->

    <div id="sidebar" class="sidebar">

        <div class="sidebar-header">
            <b>Chat History</b>

            <button
                id="closeSidebar"
                type="button"
            >
                ✕
            </button>
        </div>

        <button
            id="sidebarNewChat"
            class="sidebar-new-chat"
            type="button"
        >
            + New Chat
        </button>

        <input
            type="text"
            id="historySearch"
            placeholder="Search chats..."
            autocomplete="off"
        >

        <button
            id="clearHistorySearch"
            type="button"
        >
            ✕ Clear Search
        </button>

        <div id="sidebarHistory"></div>

    </div>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>Normal Chat</h1>

        <div class="header-buttons">

            <button
                id="historyButton"
                type="button"
            >
                History
            </button>

            <button
                id="newChatButton"
                type="button"
            >
                New Chat
            </button>

            <button
                id="settingsButton"
                type="button"
            >
                ⚙️
            </button>

            <button
                id="loginButton"
                type="button"
            >
                Login
            </button>

        </div>

    </div>


    <!-- =========================
         CHAT
    ========================= -->

    <div
        id="chatBox"
        class="chat-box"
    ></div>


    <!-- =========================
         INPUT
    ========================= -->

    <div class="input-area">

        <div id="selectedFile"></div>

        <div class="attach-wrap">

            <button
                id="attachButton"
                type="button"
                aria-label="Add files"
                title="Add files"
            >
                +
            </button>

            <div
                id="attachMenu"
                class="attach-menu"
                role="menu"
                aria-hidden="true"
            >

                <button
                    id="uploadFilesOption"
                    class="attach-menu-item"
                    type="button"
                    role="menuitem"
                >

                    <span class="attach-menu-icon">
                        📎
                    </span>

                    <span class="attach-menu-text">

                        <span class="attach-menu-title">
                            Add photos &amp; files
                        </span>

                        <span class="attach-menu-subtitle">
                            Upload from your computer
                        </span>

                    </span>

                </button>

            </div>

            <input
                type="file"
                id="fileInput"
                accept="image/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx"
            >

        </div>


        <input
            type="text"
            id="message"
            placeholder="Type your message..."
            autocomplete="off"

        /* =========================
           MARKDOWN RENDERER
        ========================= */

        function renderMessageContent(
            content
        ) {

            const source =
                String(
                    content ?? ""
                )
                .replace(
                    /\r\n/g,
                    "\n"
                )
                .replace(
                    /\r/g,
                    "\n"
                );

            const codeBlocks = [];

            let text =
                source.replace(
                    /```(?:[a-zA-Z0-9_+-]+)?\n?([\s\S]*?)```/g,
                    function (
                        _,
                        code
                    ) {

                        const token =
                            `@@CODEBLOCK_${codeBlocks.length}@@`;

                        codeBlocks.push(
                            code.replace(
                                /^\n|\n$/g,
                                ""
                            )
                        );

                        return token;
                    }
                );

            let html =
                escapeHtml(
                    text
                );

            html =
                html.replace(
                    /^### (.+)$/gm,
                    "<h3>$1</h3>"
                );

            html =
                html.replace(
                    /^## (.+)$/gm,
                    "<h2>$1</h2>"
                );

            html =
                html.replace(
                    /^# (.+)$/gm,
                    "<h1>$1</h1>"
                );

            html =
                html.replace(
                    /\*\*(.+?)\*\*/g,
                    "<strong>$1</strong>"
                );

            html =
                html.replace(
                    /\*([^*\n]+)\*/g,
                    "<em>$1</em>"
                );

            html =
                html.replace(
                    /`([^`\n]+)`/g,
                    "<code>$1</code>"
                );

            const lines =
                html.split(
                    "\n"
                );

            let output = "";

            let inUl = false;

            let inOl = false;

            for (
                let i = 0;
                i < lines.length;
                i++
            ) {

                const line =
                    lines[i];

                const unordered =
                    /^[-*]\s+(.+)$/.exec(
                        line
                    );

                const ordered =
                    /^\d+\.\s+(.+)$/.exec(
                        line
                    );

                if (unordered) {

                    if (inOl) {

                        output +=
                            "</ol>";

                        inOl = false;
                    }

                    if (!inUl) {

                        output +=
                            "<ul>";

                        inUl = true;
                    }

                    output +=
                        `<li>${unordered[1]}</li>`;

                    continue;
                }

                if (ordered) {

                    if (inUl) {

                        output +=
                            "</ul>";

                        inUl = false;
                    }

                    if (!inOl) {

                        output +=
                            "<ol>";

                        inOl = true;
                    }

                    output +=
                        `<li>${ordered[1]}</li>`;

                    continue;
                }

                if (inUl) {

                    output +=
                        "</ul>";

                    inUl = false;
                }

                if (inOl) {

                    output +=
                        "</ol>";

                    inOl = false;
                }

                if (!line.trim()) {

                    output +=
                        "<br>";

                } else {

                    output +=
                        line +
                        "<br>";
                }
            }

            if (inUl) {
                output += "</ul>";
            }

            if (inOl) {
                output += "</ol>";
            }

            html = output;

            html =
                html.replace(
                    /(<br>){3,}/g,
                    "<br><br>"
                );

            html =
                `<div>${html}</div>`;

            codeBlocks.forEach(
                function (
                    code,
                    index
                ) {

                    const escapedCode =
                        escapeHtml(
                            code
                        );

                    const block = `
                        <pre>
                            <button
                                type="button"
                                class="code-copy-button"
                                data-code-index="${index}"
                            >
                                Copy code
                            </button>
                            <code>${escapedCode}</code>
                        </pre>
                    `;

                    html =
                        html.replace(
                            `@@CODEBLOCK_${index}@@`,
                            block
                        );
                }
            );

            return html;
        }

        /* =========================
           VOICE INPUT
        ========================= */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let recognition = null;

        let isListening = false;

        if (
            SpeechRecognition &&
            micButton
        ) {

            recognition =
                new SpeechRecognition();

            recognition.continuous =
                false;

            recognition.interimResults =
                true;

            recognition.lang =
                "en-IN";

            recognition.onstart =
                function () {

                    isListening =
                        true;

                    micButton.textContent =
                        "🔴";

                    micButton.title =
                        "Listening...";
                };

            recognition.onresult =
                function (event) {

                    let transcript =
                        "";

                    for (
                        let i =
                            event.resultIndex;
                        i <
                            event.results.length;
                        i++
                    ) {

                        transcript +=
                            event.results[i][0]
                                .transcript;
                    }

                    messageInput.value =
                        transcript.trim();
                };

            recognition.onerror =
                function (event) {

                    console.error(
                        "Voice input error:",
                        event.error
                    );
                };

            recognition.onend =
                function () {

                    isListening =
                        false;

                    micButton.textContent =
                        "🎙️";

                    micButton.title =
                        "Voice input";
                };

            micButton.addEventListener(
                "click",
                function () {

                    if (
                        isListening
                    ) {

                        recognition.stop();

                        return;
                    }

                    try {

                        recognition.start();

                    } catch (error) {

                        console.error(
                            "Voice start error:",
                            error
                        );
                    }
                }
            );

        } else {

            micButton.disabled =
                true;

            micButton.title =
                "Voice input is not supported.";
        }

        function speakReply(
            text
        ) {

                return;

            if (
                !(
                    "speechSynthesis"
                    in window
                )
            ) {
                return;
            }

            const cleanText =
                String(
                    text || ""
                ).trim();

            if (!cleanText) {
                return;
            }

            window.speechSynthesis.cancel();

            const utterance =
                new SpeechSynthesisUtterance(
                    cleanText
                );

            utterance.lang =
                "en-IN";

            utterance.rate =
                1;

            utterance.pitch =
                1;

            utterance.volume =
                1;

            window.speechSynthesis.speak(
                utterance
            );
        }

                    confirm(
                        "Kya aap logout karna chahte ho?"
                    );

                if (
                    !confirmLogout
                ) {
                    return;
                }

                try {

                    const response =
                        await fetch(
                            "/logout",
                            {
                                method: "POST",
                                credentials: "include"
                            }
                        );

                    const contentType =
                        response.headers.get(
                            "content-type"
                        ) || "";

                    const data =
                        contentType.includes(
                            "application/json"
                        )
                            ? await response.json()
                            : {};

                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            data.error ||
                            "Logout failed"
                        );
                    }

                    loggedInUsername =
                        null;

                    loginButton.textContent =
                        "Login";

                    settingsUsername.textContent =
                        "Not logged in";

                    settingsModal.style.display =
                        "none";

                    conversationHistory =
                        [];

                    chatBox.innerHTML =
                        "";

                    localStorage.removeItem(
                        "normalChatCurrent"
                    );

                    if (
                        "speechSynthesis"
                        in window
                    ) {

                        window.speechSynthesis.cancel();
                    }

                    alert(
                        "Logout successful!"
                    );

                } catch (error) {

                    console.error(

        /* =========================
           SEND MESSAGE
        ========================= */

        async function sendMessage(
            messageOverride = null
        ) {

            if (
                isStreaming
            ) {
                return;
            }

            const message =
                messageOverride !== null
                    ? String(
                        messageOverride
                    ).trim()
                    : messageInput.value.trim();

            if (!message) {
                return;
            }

            if (
                !loggedInUsername
            ) {

                loginModal.style.display =
                    "flex";

                authUsername.focus();

                return;
            }

            isStreaming =
                true;

            sendButton.style.display =
                "none";

            stopButton.style.display =
                "block";

            sendButton.disabled =
                true;

            micButton.disabled =
                true;

            messageInput.disabled =
                true;

            const attachmentForRequest =
                selectedAttachment;


            conversationHistory.push({
                role: "user",
                content: message,

                attachment:
                    attachmentForRequest
                        ? {
                            name:
                                attachmentForRequest.name,

                            mimeType:
                                attachmentForRequest.mimeType
                        }
                        : null
            });


            addMessageToScreen(
                "user",
                message,
                attachmentForRequest
            );


            messageInput.value =
                "";

            selectedAttachment =
                null;

            fileInput.value =
                "";

            selectedFile.style.display =
                "none";

            selectedFile.textContent =
                "";


            saveCurrentChat();


            const thinking =
                document.createElement(
                    "div"
                );

            thinking.className =
                "message bot";

            thinking.id =
                "thinking";

            thinking.innerHTML = `
                <b>Normal Chat:</b><br>
                <span class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            `;

            chatBox.appendChild(
                thinking
            );

            chatBox.scrollTop =
                chatBox.scrollHeight;


            activeAbortController =
                new AbortController();

            let streamingMessage =
                null;

            let fullReply =
                "";

            let editedImageAttachment =
                null;


            try {

                const response =
                    await fetch(
                        `${API_URL}/chat`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "include",

                            signal:
                                activeAbortController.signal,

                            body:
                                JSON.stringify({

                                    message:
                                        message,

                                    history:
                                        conversationHistory,

                                    image:
                                        attachmentForRequest
                                            ? {
                                                name:
                                                    attachmentForRequest.name,

                                                mimeType:
                                                    attachmentForRequest.mimeType,

                                                dataUrl:
                                                    attachmentForRequest.dataUrl
                                            }
                                            : null
                                })
                        }
                    );


                const contentType =
                    response.headers.get(
                        "content-type"
                    ) || "";


                if (
                    !response.ok &&
                    contentType.includes(
                        "application/json"
                    )
                ) {

                    const errorData =
                        await response.json();

                    throw new Error(
                        errorData.error ||
                        "Backend error"
                    );
                }


                if (
                    !response.ok
                ) {

                    throw new Error(
                        `Server returned ${response.status}`
                    );
                }


                if (thinking) {
                    thinking.remove();
                }


                streamingMessage =
                    createStreamingMessage();


                const streamingText =
                    streamingMessage.querySelector(
                        ".streaming-text"
                    );


                if (
                    !response.body
                ) {

                    throw new Error(
                        "Streaming response available nahi hai."
                    );
                }


                const reader =
                    response.body.getReader();

                const decoder =
                    new TextDecoder(
                        "utf-8"
                    );

                let buffer =
                    "";


                while (true) {

                    const {
                        value,
                        done
                    } =
                        await reader.read();


                    if (done) {
                        break;
                    }


                    buffer +=
                        decoder.decode(
                            value,
                            {
                                stream: true
                            }
                        );


                    const events =
                        buffer.split(
                            "\n\n"
                        );


                    buffer =
                        events.pop() ||
                        "";


                    for (
                        const event
                        of events
                    ) {

                        const lines =
                            event.split(
                                "\n"
                            );


                        for (
                            const line
                            of lines
                        ) {

                            if (
                                !line.startsWith(
                                    "data:"
                                )
                            ) {
                                continue;
                            }


                            const jsonText =
                                line
                                    .slice(5)
                                    .trim();


                            if (!jsonText) {
                                continue;
                            }


                            let payload;


                            try {

                                payload =
                                    JSON.parse(
                                        jsonText
                                    );

                            } catch (parseError) {

                                console.error(
                                    "Stream JSON parse error:",
                                    parseError
                                );

                                continue;
                            }


                            if (
                                payload.type ===
                                "image"
                            ) {

                                const mimeType =
                                    String(
                                        payload.mimeType ||
                                        "image/png"
                                    );

                                const imageData =
                                    String(
                                        payload.data ||
                                        ""
                                    );

                                if (
                                    imageData
                                ) {

                                    editedImageAttachment =
                                        {
                                            name:
                                                "edited-image.png",

                                            mimeType:
                                                mimeType,

                                            dataUrl:
                                                `data:${mimeType};base64,${imageData}`
                                        };
                                }

                                continue;
                            }


                            if (
                                payload.type ===
                                "chunk"
                            ) {

                                const chunk =
                                    String(
                                        payload.text ||
                                        ""
                                    );

                                fullReply +=
                                    chunk;

                                streamingText.textContent =
                                    fullReply;

                                chatBox.scrollTop =
                                    chatBox.scrollHeight;
                            }
                        }
                    }
                }


                fullReply =
                    fullReply.trim();


                if (!fullReply) {

                    if (
                        streamingMessage
                    ) {
                        streamingMessage.remove();
                    }

                    throw new Error(
                        "AI ne empty reply diya."
                    );
                }


                conversationHistory.push({
                    role: "assistant",
                    content: fullReply,

                    attachment:
                        editedImageAttachment
                            ? {
                                name:
                                    editedImageAttachment.name,

                                mimeType:
                                    editedImageAttachment.mimeType,

                                dataUrl:
                                    editedImageAttachment.dataUrl
                            }
                            : null
                });


                saveCurrentChat();


                if (
                    streamingMessage
                ) {

                    streamingMessage.remove();
                }


                addMessageToScreen(
                    "assistant",
                    fullReply,
                    editedImageAttachment
                );


                speakReply(
                    fullReply
                );


                chatBox.scrollTop =
                    chatBox.scrollHeight;


            } catch (error) {

                if (thinking) {
                    thinking.remove();
                }


                if (
                    error.name ===
                    "AbortError"
                ) {

                    if (
                        streamingMessage
                    ) {

                        streamingMessage.remove();
                    }


                    if (
                        fullReply
                    ) {

                        conversationHistory.push({
                            role:
                                "assistant",

                            content:
                                fullReply.trim(),

                            attachment:
                                editedImageAttachment
                                    ? {
                                        name:
                                            editedImageAttachment.name,

                                        mimeType:
                                            editedImageAttachment.mimeType,

                                        dataUrl:
                                            editedImageAttachment.dataUrl
                                    }
                                    : null
                        });


                        saveCurrentChat();


                        addMessageToScreen(
                            "assistant",
                            fullReply.trim(),
                            editedImageAttachment
                        );


                        speakReply(
                            fullReply.trim()
                        );
                    }

                } else {

                    if (
                        streamingMessage
                    ) {

                        streamingMessage.remove();
                    }


                    addMessageToScreen(
                        "assistant",
                        "Error: " +
                        error.message
                    );


                    console.error(
                        "Chat error:",
                        error
                    );
                }

            } finally {

                isStreaming =
                    false;

                activeAbortController =
                    null;

                sendButton.style.display =
                    "block";

                stopButton.style.display =
                    "none";

                sendButton.disabled =
                    false;

                micButton.disabled =
                    false;

                messageInput.disabled =
                    false;

                messageInput.focus();
            }
        }


        /* =========================
           EDIT USER MESSAGE
        ========================= */

        function editUserMessage(
            messageIndex,
            messageElement
        ) {

            if (isStreaming) {
                return;
            }

            const message =
                conversationHistory[
                    messageIndex
                ];

            if (
                !message ||
                message.role !== "user"
            ) {
                return;
            }

            const originalText =
                String(
                    message.content ||
                    ""
                );

            const contentDiv =
                messageElement.querySelector(
                    ".message-content"
                );

            if (!contentDiv) {
                return;
            }


            const editor =
                document.createElement(
                    "textarea"
                );

            editor.className =
                "edit-message-input";

            editor.value =
                originalText;

            editor.rows =
                Math.min(
                    6,
                    Math.max(
                        2,
                        originalText.split(
                            "\n"
                        ).length
                    )
                );


            const editActions =
                document.createElement(
                    "div"
                );

            editActions.className =
                "edit-message-actions";


            const saveButton =
                document.createElement(
                    "button"
                );

            saveButton.type =
                "button";

            saveButton.className =
                "message-action";

            saveButton.textContent =
                "Send";


            const cancelButton =
                document.createElement(
                    "button"
                );

            cancelButton.type =
                "button";

            cancelButton.className =
                "message-action";

            cancelButton.textContent =
                "Cancel";


            editActions.appendChild(
                saveButton
            );

            editActions.appendChild(
                cancelButton
            );


            contentDiv.replaceWith(
                editor
            );


            const oldActions =
                messageElement.querySelector(
                    ".message-actions"
                );

            if (oldActions) {
                oldActions.remove();
            }


            messageElement.appendChild(
                editActions
            );


            editor.focus();

            editor.setSelectionRange(
                editor.value.length,
                editor.value.length
            );


            const cancelEdit =
                function () {

                    const restoredContent =
                        document.createElement(
                            "div"
                        );

                    restoredContent.className =
                        "message-content";

                    restoredContent.innerHTML =
                        escapeHtml(
                            originalText
                        );


                    editor.replaceWith(
                        restoredContent
                    );

                    editActions.remove();


                    const actions =
                        document.createElement(
                            "div"
                        );

                    actions.className =
                        "message-actions";


                    const button =
                        document.createElement(
                            "button"
                        );

                    button.type =
                        "button";

                    button.className =
                        "message-action";

                    button.textContent =
                        "Edit";


                    button.addEventListener(
                        "click",
                        function () {

                            editUserMessage(
                                messageIndex,
                                messageElement
                            );
                        }
                    );


                    actions.appendChild(
                        button
                    );

                    messageElement.appendChild(
                        actions
                    );
                };


            cancelButton.addEventListener(
                "click",
                cancelEdit
            );


            const saveEdit =
                function () {

                    const newText =
                        editor.value.trim();

                    if (!newText) {
                        editor.focus();
                        return;
                    }


                    conversationHistory =
                        conversationHistory.slice(
                            0,
                            messageIndex
                        );


                    chatBox.innerHTML =
                        "";


                    conversationHistory.forEach(
                        function (msg) {

                            if (
                                msg &&
                                msg.role &&
                                typeof msg.content ===
                                    "string"
                            ) {

                                addMessageToScreen(
                                    msg.role,
                                    msg.content,
                                    msg.attachment || null
                                );
                            }
                        }
                    );


                    saveCurrentChat();

                    sendMessage(
                        newText
                    );
                };


            saveButton.addEventListener(
                "click",
                saveEdit
            );


            editor.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {

                        event.preventDefault();

                        saveEdit();
                    }

                    if (
                        event.key === "Escape"
                    ) {

                        cancelEdit();
                    }
                }
            );
        }

        /* =========================
           BRANCH
        ========================= */

        async function branchConversation(
            assistantIndex
        ) {

            if (isStreaming) {
                return;
            }

            if (
                assistantIndex < 0 ||
                assistantIndex >=
                    conversationHistory.length ||
                !conversationHistory[
                    assistantIndex
                ] ||
                conversationHistory[
                    assistantIndex
                ].role !== "assistant"
            ) {
                return;
            }


            const branchHistory =
                conversationHistory.slice(
                    0,
                    assistantIndex + 1
                );


            if (
                !branchHistory.length
            ) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/branch`,
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "include",

                            body:
                                JSON.stringify({
                                    history:
                                        branchHistory
                                })
                        }
                    );


                const contentType =
                    response.headers.get(
                        "content-type"
                    ) || "";


                const data =
                    contentType.includes(
                        "application/json"
                    )
                        ? await response.json()
                        : {
                            error:
                                `Server returned ${response.status}`
                        };


                if (
                    !response.ok
                ) {

                    throw new Error(
                        data.error ||
                        "Branch create failed"
                    );
                }


                conversationHistory =
                    Array.isArray(
                        data.history
                    )
                        ? data.history
                        : branchHistory;


                chatBox.innerHTML =
                    "";


                conversationHistory.forEach(
                    function (msg) {

                        if (
                            msg &&
                            msg.role &&
                            typeof msg.content ===
                                "string"
                        ) {

                            addMessageToScreen(
                                msg.role,
                                msg.content,
                                msg.attachment || null
                            );
                        }
                    }
                );


                saveCurrentChat();

                messageInput.focus();


            } catch (error) {

                console.error(
                    "Branch error:",
                    error
                );

                alert(
                    "Branch create nahi hua: " +
                    error.message
                );
            }
        }


        /* =========================
           REGENERATE
        ========================= */

        function regenerateResponse(
            assistantIndex
        ) {

            if (isStreaming) {
                return;
            }


            if (
                assistantIndex <= 0 ||
                assistantIndex >=
                    conversationHistory.length ||
                !conversationHistory[
                    assistantIndex
                ] ||
                conversationHistory[
                    assistantIndex
                ].role !== "assistant"
            ) {
                return;
            }


            const userMessage =
                conversationHistory[
                    assistantIndex - 1
                ];


            if (
                !userMessage ||
                userMessage.role !==
                    "user" ||
                !String(
                    userMessage.content
                ).trim()
            ) {
                return;
            }


            const messageText =
                String(
                    userMessage.content
                ).trim();


            conversationHistory =
                conversationHistory.slice(
                    0,
                    assistantIndex - 1
                );


            chatBox.innerHTML =
                "";


            conversationHistory.forEach(
                function (msg) {

                    if (
                        msg &&
                        msg.role &&
                        typeof msg.content ===
                            "string"
                    ) {

                        addMessageToScreen(
                            msg.role,
                            msg.content,
                            msg.attachment || null
                        );
                    }
                }
            );


            saveCurrentChat();

            sendMessage(
                messageText
            );
        }

                                chat,
                                realIndex
                            );
                        }
                    );

                sidebarHistory.innerHTML =
                    `<p>${escapeHtml(
                        error.message
                    )}</p>`;


                console.error(
                    "History error:",
                    error
                );
