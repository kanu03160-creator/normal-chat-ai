<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Normal Chat AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #fff;
        }

        /* ==========================================
           HEADER
        ========================================== */

        .header {
            height: 72px;
            width: 100%;
            background: #111;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header button {
            border: 1px solid #333;
            background: #1b1b1b;
            color: #eee;
            padding: 10px 15px;
            border-radius: 9px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .header button:hover {
            background: #292929;
            border-color: #444;
        }

        .header button:active {
            transform: scale(0.97);
        }

        #loginButton {
            background: #f1f1f1;
            color: #111;
            border-color: #f1f1f1;
            font-weight: 600;
        }

        #loginButton:hover {
            background: #fff;
        }


        /* ==========================================
           CHAT BOX
        ========================================== */

        .chat-box {
            height: calc(100vh - 144px);
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px;
            background: #000 !important;
            color: #fff !important;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #000;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background: #444;
        }


        /* ==========================================
           MESSAGE
        ========================================== */

        .message {
            width: fit-content;
            max-width: 78%;
            margin-bottom: 16px;
            padding: 13px 16px;
            border-radius: 14px;
            line-height: 1.55;
            font-size: 15px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: normal;
        }

        .message b {
            font-size: 13px;
            opacity: 0.85;
        }

        .user {
            margin-left: auto;
            margin-right: 0;
            background: #262626;
            color: #fff;
            border: 1px solid #333;
            border-bottom-right-radius: 5px;
        }

        .bot {
            margin-left: 0;
            margin-right: auto;
            background: #151515;
            color: #f5f5f5;
            border: 1px solid #252525;
            border-bottom-left-radius: 5px;
        }


        /* ==========================================
           TYPING DOTS
        ========================================== */

        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: #888;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }


        /* ==========================================
           INPUT AREA
        ========================================== */

        .input-area {
            height: 72px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: #000 !important;
            border-top: 1px solid #1f1f1f;
        }

        #message {
            flex: 1;
            min-width: 0;
            height: 50px;
            border: 1px solid #333;
            border-radius: 13px;
            padding: 0 16px;
            font-size: 16px;
            outline: none;
            background: #171717 !important;
            color: #fff !important;
            transition: 0.2s ease;
        }

        #message::placeholder {
            color: #777;
        }

        #message:focus {
            border-color: #555;
            background: #1b1b1b !important;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.03);
        }

        #sendButton {
            height: 50px;
            width: 82px;
            min-width: 82px;
            border: 1px solid #333;
            border-radius: 13px;
            background: #f1f1f1;
            color: #111;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        #sendButton:hover {
            background: #fff;
        }

        #sendButton:active {
            transform: scale(0.97);
        }

        #sendButton:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }


        /* ==========================================
           SIDEBAR
        ========================================== */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 370px;
            max-width: 90vw;
            height: 100vh;
            padding: 18px;
            background: #111;
            color: #fff;
            border-right: 1px solid #2a2a2a;
            box-shadow: 10px 0 35px rgba(0, 0, 0, 0.45);
            z-index: 2000;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            overflow-y: auto;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar::-webkit-scrollbar {
            width: 7px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #111;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            font-size: 21px;
        }

        .sidebar-header b {
            font-weight: 600;
        }

        #closeSidebar {
            width: 36px;
            height: 36px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1b1b1b;
            color: #bbb;
            font-size: 21px;
            cursor: pointer;
        }

        #closeSidebar:hover {
            background: #292929;
            color: #fff;
        }

        .sidebar-new-chat {
            width: 100%;
            padding: 13px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #f1f1f1;
            color: #111;
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .sidebar-new-chat:hover {
            background: #fff;
        }

        #historySearch {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #333;
            border-radius: 10px;
            outline: none;
            margin-bottom: 8px;
            font-size: 14px;
            background: #1a1a1a;
            color: #fff;
        }

        #historySearch::placeholder {
            color: #777;
        }

        #historySearch:focus {
            border-color: #555;
        }

        #clearHistorySearch {
            width: 100%;
            height: 40px;
            padding: 8px;
            border: 1px solid #333;
            border-radius: 9px;
            background: #1a1a1a;
            color: #bbb;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 13px;
        }

        #clearHistorySearch:hover {
            background: #262626;
            color: #fff;
        }

        #sidebarHistory > p {
            color: #777;
            font-size: 14px;
            padding: 5px;
        }

        .sidebar-chat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 11px;
            margin-bottom: 8px;
            min-height: 50px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: #1a1a1a;
            color: #ddd;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .sidebar-chat:hover {
            background: #242424;
            border-color: #333;
        }

        .sidebar-chat.active {
            background: #292929;
            border-color: #444;
            color: #fff;
            font-weight: 600;
        }

        .sidebar-chat-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            cursor: pointer;
            font-size: 14px;
        }

        .sidebar-actions {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
        }

        .sidebar-rename,
        .sidebar-delete {
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
            border-radius: 7px;
        }

        .sidebar-rename:hover,
        .sidebar-delete:hover {
            background: #333;
            color: #fff;
        }


        /* ==========================================
           LOGIN MODAL
        ========================================== */

        .login-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 9999;
        }

        .login-box {
            width: 380px;
            max-width: 100%;
            background: #151515;
            padding: 30px;
            border: 1px solid #303030;
            border-radius: 17px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
            position: relative;
            text-align: center;
        }

        .login-box h2 {
            color: #fff;
            margin: 0 0 25px;
            font-size: 23px;
            font-weight: 600;
        }

        .login-box input {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            margin-bottom: 13px;
            border: 1px solid #363636;
            border-radius: 9px;
            background: #202020;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .login-box input::placeholder {
            color: #777;
        }

        .login-box input:focus {
            border-color: #666;
            background: #242424;
        }

        .auth-submit {
            width: 100%;
            height: 48px;
            padding: 0;
            border: none;
            border-radius: 9px;
            background: #f1f1f1;
            color: #111;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .auth-submit:hover {
            background: #fff;
        }

        .auth-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .close-login {
            position: absolute;
            top: 11px;
            right: 13px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 25px;
            cursor: pointer;
        }

        .close-login:hover {
            background: #292929;
            color: #fff;
        }

        .auth-switch {
            color: #888;
            font-size: 14px;
            margin: 20px 0 0;
        }

        .auth-switch button {
            border: none;
            background: none;
            color: #fff;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        .auth-switch button:hover {
            color: #ccc;
        }

        #authMessage {
            min-height: 20px;
            margin: 12px 0 0;
            font-size: 14px;
            color: #bbb;
        }


        /* ==========================================
           TABLET
        ========================================== */

        @media (min-width: 601px) and (max-width: 900px) {

            .header {
                padding: 0 14px;
            }

            .header h1 {
                font-size: 21px;
            }

            .header button {
                padding: 9px 11px;
                font-size: 13px;
            }

            .chat-box {
                padding: 18px;
            }

            .message {
                max-width: 85%;
            }

            .sidebar {
                width: 330px;
            }
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .header {
                height: 64px;
                padding: 0 9px;
                gap: 6px;
            }

            .header h1 {
                font-size: 19px;
                white-space: nowrap;
            }

            .header-buttons {
                gap: 4px;
            }

            .header button {
                padding: 8px 8px;
                font-size: 11px;
                border-radius: 7px;
            }

            .chat-box {
                height: calc(100vh - 128px);
                padding: 13px 9px;
            }

            .message {
                max-width: 92%;
                padding: 10px 12px;
                margin-bottom: 10px;
                font-size: 14px;
                line-height: 1.5;
                border-radius: 11px;
            }

            .message b {
                font-size: 12px;
            }

            .input-area {
                height: 64px;
                padding: 8px;
                gap: 7px;
            }

            #message {
                height: 48px;
                padding: 0 11px;
                font-size: 15px;
                border-radius: 10px;
            }

            #sendButton {
                width: 65px;
                min-width: 65px;
                height: 48px;
                font-size: 13px;
                border-radius: 10px;
            }

            .sidebar {
                width: 88vw;
                max-width: 340px;
                padding: 14px;
            }

            .sidebar-header {
                font-size: 20px;
                margin-bottom: 14px;
            }

            .sidebar-new-chat {
                padding: 12px;
                font-size: 14px;
            }

            #historySearch {
                height: 44px;
                font-size: 14px;
            }

            #clearHistorySearch {
                height: 38px;
                font-size: 13px;
            }

            .sidebar-chat {
                padding: 10px;
                min-height: 48px;
            }

            .sidebar-chat-title {
                font-size: 13px;
            }

            .sidebar-rename,
            .sidebar-delete {
                font-size: 14px;
            }

            .login-box {
                width: calc(100vw - 30px);
                padding: 25px 18px;
                border-radius: 14px;
            }

            .login-box h2 {
                font-size: 21px;
                margin-bottom: 20px;
            }

            .login-box input {
                height: 46px;
                font-size: 14px;
            }

            .auth-submit {
                height: 46px;
                font-size: 14px;
            }
        }


        /* ==========================================
           VERY SMALL PHONES
        ========================================== */

        @media (max-width: 380px) {

            .header h1 {
                font-size: 17px;
            }

            .header-buttons {
                gap: 3px;
            }

            .header button {
                padding: 7px 6px;
                font-size: 10px;
            }

            .message {
                max-width: 95%;
                font-size: 13px;
            }

            #sendButton {
                width: 58px;
                min-width: 58px;
                font-size: 12px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         SIDEBAR
    ========================= -->

    <div id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <b>Chat History</b>

            <button
                id="closeSidebar"
                type="button"
            >
                ✕
            </button>

        </div>


        <button
            id="sidebarNewChat"
            class="sidebar-new-chat"
            type="button"
        >
            + New Chat
        </button>


        <input
            type="text"
            id="historySearch"
            placeholder="Search chats..."
            autocomplete="off"
        >


        <button
            id="clearHistorySearch"
            type="button"
        >
            ✕ Clear Search
        </button>


        <div id="sidebarHistory"></div>

    </div>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>Normal Chat</h1>

        <div class="header-buttons">

            <button
                id="historyButton"
                type="button"
            >
                History
            </button>

            <button
                id="newChatButton"
                type="button"
            >
                New Chat
            </button>

            <button
                id="loginButton"
                type="button"
            >
                Login
            </button>

        </div>

    </div>


    <!-- =========================
         CHAT
    ========================= -->

    <div
        id="chatBox"
        class="chat-box"
    ></div>


    <!-- =========================
         INPUT
    ========================= -->

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            type="button"
        >
            Send
        </button>

    </div>


    <!-- =========================
         LOGIN MODAL
    ========================= -->

    <div id="loginModal" class="login-modal">

        <div class="login-box">

            <button
                id="closeLoginModal"
                class="close-login"
                type="button"
            >
                ×
            </button>

            <h2 id="authTitle">Login</h2>

            <input
                type="text"
                id="authUsername"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                type="password"
                id="authPassword"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                id="authSubmit"
                class="auth-submit"
                type="button"
            >
                Login
            </button>

            <p id="authMessage"></p>

            <p class="auth-switch">
                Don't have an account?
                <button
                    id="switchAuth"
                    type="button"
                >
                    Create Account
                </button>
            </p>

        </div>

    </div>


    <script>

        /* =================================
           CONFIG
        ================================= */

        const API_URL = "";

        const loginButton =
            document.getElementById("loginButton");

        const loginModal =
            document.getElementById("loginModal");

        const authTitle =
            document.getElementById("authTitle");

        const authUsername =
            document.getElementById("authUsername");

        const authPassword =
            document.getElementById("authPassword");

        const authSubmit =
            document.getElementById("authSubmit");

        const authMessage =
            document.getElementById("authMessage");

        const switchAuth =
            document.getElementById("switchAuth");

        const closeLoginModal =
            document.getElementById("closeLoginModal");


        let isSignupMode = false;

        let loggedInUsername = null;


        function updateAuthMode() {

            authTitle.textContent =
                isSignupMode
                    ? "Create Account"
                    : "Login";

            authSubmit.textContent =
                isSignupMode
                    ? "Sign Up"
                    : "Login";

            switchAuth.textContent =
                isSignupMode
                    ? "Login"
                    : "Create Account";

            document.querySelector(".auth-switch").firstChild.textContent =
                isSignupMode
                    ? "Already have an account? "
                    : "Don't have an account? ";
        }


        switchAuth.addEventListener(
            "click",
            () => {

                isSignupMode =
                    !isSignupMode;

                updateAuthMode();

                authMessage.textContent = "";

                authUsername.value = "";

                authPassword.value = "";
            }
        );


        loginButton.addEventListener(
            "click",
            () => {

                loginModal.style.display =
                    "flex";

                authUsername.focus();
            }
        );


        closeLoginModal.addEventListener(
            "click",
            () => {

                loginModal.style.display =
                    "none";
            }
        );


        loginModal.addEventListener(
            "click",
            (event) => {

                if (
                    event.target === loginModal
                ) {

                    loginModal.style.display =
                        "none";
                }
            }
        );


        async function checkLoginStatus() {

            try {

                const response =
                    await fetch(
                        "/me",
                        {
                            credentials: "include"
                        }
                    );

                const data =
                    await response.json();


                if (data.logged_in) {

                    loggedInUsername =
                        data.username;

                    loginButton.textContent =
                        data.username;

                } else {

                    loggedInUsername = null;

                    loginButton.textContent =
                        "Login";
                }

            } catch (error) {

                console.error(
                    "Login status error:",
                    error
                );
            }
        }


        authSubmit.addEventListener(
            "click",
            async () => {

                const username =
                    authUsername.value.trim();

                const password =
                    authPassword.value;


                if (!username || !password) {

                    authMessage.textContent =
                        "Username and password required";

                    return;
                }


                authSubmit.disabled =
                    true;

                authMessage.textContent =
                    "Please wait...";


                try {

                    const endpoint =
                        isSignupMode
                            ? "/signup"
                            : "/login";


                    const response =
                        await fetch(
                            endpoint,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "include",

                                body: JSON.stringify({
                                    username,
                                    password
                                })
                            }
                        );


                    const contentType =
                        response.headers.get(
                            "content-type"
                        ) || "";


                    const data =
                        contentType.includes(
                            "application/json"
                        )
                            ? await response.json()
                            : {
                                error:
                                    `Server returned ${response.status} instead of JSON`
                            };


                    if (!response.ok) {

                        authMessage.textContent =
                            data.error ||
                            "Something went wrong";

                        return;
                    }


                    authMessage.textContent =
                        isSignupMode
                            ? "Account created successfully!"
                            : "Login successful!";


                    await checkLoginStatus();


                    setTimeout(
                        () => {

                            loginModal.style.display =
                                "none";

                            authUsername.value = "";

                            authPassword.value = "";

                            authMessage.textContent = "";

                            loadCurrentChat();

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Auth error:",
                        error
                    );

                    authMessage.textContent =
                        "Server connection error";

                } finally {

                    authSubmit.disabled =
                        false;
                }
            }
        );


        checkLoginStatus();


        /* =================================
           VARIABLES
        ================================= */

        let conversationHistory = [];


        const messageInput =
            document.getElementById("message");

        const sendButton =
            document.getElementById("sendButton");

        const chatBox =
            document.getElementById("chatBox");

        const newChatButton =
            document.getElementById("newChatButton");

        const historyButton =
            document.getElementById("historyButton");

        const sidebar =
            document.getElementById("sidebar");

        const closeSidebar =
            document.getElementById("closeSidebar");

        const sidebarNewChat =
            document.getElementById("sidebarNewChat");

        const sidebarHistory =
            document.getElementById("sidebarHistory");

        const historySearch =
            document.getElementById("historySearch");

        const clearHistorySearch =
            document.getElementById("clearHistorySearch");


        /* =================================
           ESCAPE HTML
        ================================= */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        /* =================================
           SAVE CURRENT CHAT
        ================================= */

        function saveCurrentChat() {

            localStorage.setItem(
                "normalChatCurrent",
                JSON.stringify(conversationHistory)
            );
        }


        /* =================================
           LOAD CURRENT CHAT
        ================================= */

        function loadCurrentChat() {

            const savedChat =
                localStorage.getItem(
                    "normalChatCurrent"
                );


            if (!savedChat) {
                return;
            }


            try {

                const parsed =
                    JSON.parse(savedChat);


                if (!Array.isArray(parsed)) {

                    conversationHistory = [];

                    return;
                }


                conversationHistory =
                    parsed;


                chatBox.innerHTML = "";


                conversationHistory.forEach(
                    function (msg) {

                        addMessageToScreen(
                            msg.role,
                            msg.content
                        );

                    }
                );


                chatBox.scrollTop =
                    chatBox.scrollHeight;


            } catch (error) {

                console.error(
                    "Current chat load error:",
                    error
                );


                conversationHistory = [];


                localStorage.removeItem(
                    "normalChatCurrent"
                );
            }
        }


        /* =================================
           ADD MESSAGE
        ================================= */

        function addMessageToScreen(
            role,
            content
        ) {

            const div =
                document.createElement("div");


            div.className =
                "message " +
                (
                    role === "user"
                        ? "user"
                        : "bot"
                );


            const name =
                role === "user"
                    ? "You"
                    : "Normal Chat";


            div.innerHTML = `
                <b>${name}:</b><br>
                ${escapeHtml(content)}
            `;


            chatBox.appendChild(div);
        }


        /* =================================
           SEND MESSAGE
        ================================= */

        async function sendMessage() {

            const message =
                messageInput.value.trim();


            if (!message) {
                return;
            }


            sendButton.disabled =
                true;


            /* USER MESSAGE */

            conversationHistory.push({
                role: "user",
                content: message
            });


            addMessageToScreen(
                "user",
                message
            );


            messageInput.value = "";


            saveCurrentChat();


            /* TYPING */

            const thinking =
                document.createElement("div");


            thinking.className =
                "message bot";


            thinking.id =
                "thinking";


            thinking.innerHTML = `
                <b>Normal Chat:</b><br>

                <span class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            `;


            chatBox.appendChild(
                thinking
            );


            chatBox.scrollTop =
                chatBox.scrollHeight;


            try {

                const response =
                    await fetch(
                        `${API_URL}/chat`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message: message,
                                history:
                                    conversationHistory
                            })
                        }
                    );


                const data =
                    await response.json();


                if (thinking) {
                    thinking.remove();
                }


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Backend error"
                    );
                }


                const reply =
                    String(
                        data.reply || ""
                    ).trim();


                if (!reply) {

                    throw new Error(
                        "AI ne empty reply diya."
                    );
                }


                /* BOT MESSAGE */

                conversationHistory.push({
                    role: "assistant",
                    content: reply
                });


                addMessageToScreen(
                    "assistant",
                    reply
                );


                saveCurrentChat();


                chatBox.scrollTop =
                    chatBox.scrollHeight;


            } catch (error) {

                if (thinking) {
                    thinking.remove();
                }


                addMessageToScreen(
                    "assistant",
                    "Error: " +
                    error.message
                );


                console.error(
                    "Chat error:",
                    error
                );

            } finally {

                sendButton.disabled =
                    false;

                messageInput.focus();
            }
        }


        /* =================================
           NEW CHAT
        ================================= */

        async function newChat() {

            try {

                const response =
                    await fetch(
                        `${API_URL}/new-chat`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                history:
                                    conversationHistory
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "New Chat error"
                    );
                }


                conversationHistory = [];


                localStorage.removeItem(
                    "normalChatCurrent"
                );


                chatBox.innerHTML = "";


                messageInput.value = "";


                sidebar.classList.remove(
                    "open"
                );


                messageInput.focus();


            } catch (error) {

                console.error(
                    "New Chat error:",
                    error
                );


                alert(
                    "New Chat nahi bana: " +
                    error.message
                );
            }
        }


        /* =================================
           SHOW SIDEBAR
        ================================= */

        async function showSidebar() {

            sidebar.classList.add(
                "open"
            );


            sidebarHistory.innerHTML =
                "<p>Loading...</p>";


            try {

                const response =
                    await fetch(
                        `${API_URL}/history`
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "History load failed"
                    );
                }


                sidebarHistory.innerHTML =
                    "";


                if (
                    !Array.isArray(
                        data.history
                    ) ||
                    data.history.length === 0
                ) {

                    sidebarHistory.innerHTML =
                        "<p>No chats yet.</p>";

                    return;
                }


                data.history
                    .slice()
                    .reverse()
                    .forEach(
                        function (
                            chat,
                            reverseIndex
                        ) {

                            const realIndex =
                                data.history.length -
                                1 -
                                reverseIndex;


                            createHistoryItem(
                                chat,
                                realIndex
                            );

                        }
                    );


            } catch (error) {

                sidebarHistory.innerHTML =
                    `<p>${escapeHtml(
                        error.message
                    )}</p>`;


                console.error(
                    "History error:",
                    error
                );
            }
        }


        /* =================================
           CREATE HISTORY ITEM
        ================================= */

        function createHistoryItem(
            chat,
            realIndex
        ) {

            const item =
                document.createElement("div");


            item.className =
                "sidebar-chat";


            const messages =
                Array.isArray(
                    chat.messages
                )
                    ? chat.messages
                    : [];


            const firstMessage =
                messages.find(
                    function (msg) {

                        return (
                            msg &&
                            msg.role === "user"
                        );

                    }
                );


            const defaultTitle =
                firstMessage &&
                firstMessage.content
                    ? firstMessage.content
                    : "New Chat";


            const currentTitle =
                chat.title &&
                String(chat.title).trim()
                    ? chat.title
                    : defaultTitle;


            /* TITLE */

            const title =
                document.createElement(
                    "span"
                );


            title.className =
                "sidebar-chat-title";


            title.textContent =
                currentTitle;


            /* ACTIONS */

            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "sidebar-actions";


            /* RENAME */

            const renameButton =
                document.createElement(
                    "button"
                );


            renameButton.type =
                "button";


            renameButton.className =
                "sidebar-rename";


            renameButton.title =
                "Rename";


            renameButton.textContent =
                "✏️";


            /* DELETE */

            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.type =
                "button";


            deleteButton.className =
                "sidebar-delete";


            deleteButton.title =
                "Delete";


            deleteButton.textContent =
                "🗑️";


            actions.appendChild(
                renameButton
            );


            actions.appendChild(
                deleteButton
            );


            item.appendChild(
                title
            );


            item.appendChild(
                actions
            );


            /* OPEN CHAT */

            item.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(
                            ".sidebar-chat"
                        )
                        .forEach(
                            function (
                                chatItem
                            ) {

                                chatItem.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    item.classList.add(
                        "active"
                    );


                    openHistoryChat(
                        chat
                    );


                    sidebar.classList.remove(
                        "open"
                    );
                }
            );


            /* RENAME */

            renameButton.addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();

                    event.stopPropagation();


                    const newName =
                        prompt(
                            "Chat ka naya naam:",
                            currentTitle
                        );


                    if (
                        newName === null
                    ) {
                        return;
                    }


                    const trimmedName =
                        newName.trim();


                    if (!trimmedName) {

                        alert(
                            "Naam empty nahi ho sakta."
                        );

                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/history/${realIndex}/rename`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        name:
                                            trimmedName
                                    })
                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                result.error ||
                                "Rename failed"
                            );
                        }


                        await showSidebar();


                    } catch (error) {

                        console.error(
                            "Rename error:",
                            error
                        );


                        alert(
                            "Rename nahi hua: " +
                            error.message
                        );
                    }
                }
            );


            /* DELETE */

            deleteButton.addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();

                    event.stopPropagation();


                    const confirmDelete =
                        confirm(
                            "Kya ye chat delete karni hai?"
                        );


                    if (!confirmDelete) {
                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/history/${realIndex}`,
                                {
                                    method: "DELETE"
                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                result.error ||
                                "Delete failed"
                            );
                        }


                        await showSidebar();


                    } catch (error) {

                        console.error(
                            "Delete error:",
                            error
                        );


                        alert(
                            "Chat delete nahi hui: " +
                            error.message
                        );
                    }
                }
            );


            sidebarHistory.appendChild(
                item
            );
        }


        /* =================================
           OPEN OLD CHAT
        ================================= */

        function openHistoryChat(chat) {

            conversationHistory =
                Array.isArray(
                    chat.messages
                )
                    ? chat.messages
                    : [];


            chatBox.innerHTML = "";


            conversationHistory.forEach(
                function (message) {

                    if (
                        !message ||
                        !message.role
                    ) {
                        return;
                    }


                    addMessageToScreen(
                        message.role,
                        message.content || ""
                    );
                }
            );


            saveCurrentChat();


            chatBox.scrollTop =
                chatBox.scrollHeight;
        }


        /* =================================
           SEARCH HISTORY
        ================================= */

        historySearch.addEventListener(
            "input",
            function () {

                const searchText =
                    historySearch.value
                        .toLowerCase()
                        .trim();


                document
                    .querySelectorAll(
                        ".sidebar-chat"
                    )
                    .forEach(
                        function (
                            chatItem
                        ) {

                            const text =
                                chatItem.innerText
                                    .toLowerCase();


                            chatItem.style.display =
                                text.includes(
                                    searchText
                                )
                                    ? "flex"
                                    : "none";
                        }
                    );
            }
        );


        /* =================================
           CLEAR SEARCH
        ================================= */

        clearHistorySearch.addEventListener(
            "click",
            function () {

                historySearch.value =
                    "";


                document
                    .querySelectorAll(
                        ".sidebar-chat"
                    )
                    .forEach(
                        function (
                            chatItem
                        ) {

                            chatItem.style.display =
                                "flex";
                        }
                    );
            }
        );


        /* =================================
           BUTTON EVENTS
        ================================= */

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        newChatButton.addEventListener(
            "click",
            newChat
        );


        sidebarNewChat.addEventListener(
            "click",
            newChat
        );


        historyButton.addEventListener(
            "click",
            showSidebar
        );


        closeSidebar.addEventListener(
            "click",
            function () {

                sidebar.classList.remove(
                    "open"
                );
            }
        );


        /* =================================
           ENTER KEY
        ================================= */

        messageInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();
                }
            }
        );


        /* =================================
           START
        ================================= */

        loadCurrentChat();

        messageInput.focus();

    </script>

</body>

</html>
