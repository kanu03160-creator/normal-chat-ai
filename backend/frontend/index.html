<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Normal Chat AI</title>

    <style>
        
    /* FORCE DARK CHAT */
    body {
        background: #000 !important;
    }

    .chat-box {
        background: #000 !important;
        color: #fff !important;
    }

    .input-area {
        background: #000 !important;
    }

    #message {
        background: #fff !important;
        color: #000 !important;
    }
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000 !important;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        height: 80px;
        background: #202124;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
    }

    .header h1 {
        margin: 0;
        font-size: 26px;
    }

    .header-buttons {
        display: flex;
        gap: 10px;
    }

    .header button {
        background: #343541;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 9px;
        font-size: 16px;
        cursor: pointer;
    }

    .header button:hover {
        background: #4a4b55;
    }

    /* =========================
       CHAT BOX
    ========================= */

    .chat-box {
        height: calc(100vh - 160px);
        overflow-y: auto;
        padding: 20px;
        background: #000 !important;
        color: #fff !important;
    }

    .message {
        margin-bottom: 15px;
        padding: 12px 16px;
        border-radius: 10px;
        max-width: 80%;
        line-height: 1.5;
        word-wrap: break-word;
    }

    .user {
        background: #d9e7ff;
        color: #000;
        margin-left: auto;
    }

    .bot {
        background: #2b2b2b;
        color: white;
        margin-right: auto;
    }

    /* =========================
       INPUT
    ========================= */

    .input-area {
        height: 80px;
        display: flex;
        gap: 12px;
        padding: 12px;
        background: #000 !important;
    }

    #message {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 12px;
        padding: 15px;
        font-size: 18px;
        outline: none;
        background: #fff !important;
        color: #000 !important;
    }

    #sendButton {
        width: 85px;
        border: none;
        border-radius: 12px;
        background: #202124;
        color: white;
        font-size: 17px;
        cursor: pointer;
    }

    #sendButton:hover {
        background: #333;
    }

    #sendButton:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* =========================
       TYPING DOTS
    ========================= */

    .typing-dots {
        display: inline-flex;
        gap: 4px;
        align-items: center;
    }

    .typing-dots span {
        width: 7px;
        height: 7px;
        background: #555;
        border-radius: 50%;
        animation: typing 1.4s infinite;
    }

    .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {
        0%, 60%, 100% {
            opacity: 0.3;
            transform: translateY(0);
        }

        30% {
            opacity: 1;
            transform: translateY(-4px);
        }
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 370px;
        max-width: 90vw;
        height: 100vh;
        background: white;
        border-right: 1px solid #ddd;
        padding: 18px;
        z-index: 2000;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        overflow-y: auto;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 24px;
        margin-bottom: 18px;
    }

    #closeSidebar {
        border: none;
        background: transparent;
        font-size: 28px;
        cursor: pointer;
    }

    .sidebar-new-chat {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: #202124;
        color: white;
        cursor: pointer;
        margin-bottom: 12px;
        font-size: 16px;
    }

    #historySearch {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 9px;
        outline: none;
        margin-bottom: 8px;
        font-size: 16px;
    }

    #clearHistorySearch {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 9px;
        background: #eee;
        cursor: pointer;
        margin-bottom: 15px;
        font-size: 15px;
    }

    .sidebar-chat {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 12px;
        margin-bottom: 8px;
        border-radius: 9px;
        background: #f1f1f1;
        cursor: pointer;
        min-height: 52px;
    }

    .sidebar-chat:hover {
        background: #e5e5e5;
    }

    .sidebar-chat.active {
        background: #d9e7ff;
        font-weight: bold;
    }

    .sidebar-chat-title {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        cursor: pointer;
    }

    .sidebar-actions {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
    }

    .sidebar-rename,
    .sidebar-delete {
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 17px;
        padding: 5px;
        border-radius: 5px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
        .header h1 {
            font-size: 21px;
        }

        .header button {
            padding: 10px 12px;
            font-size: 14px;
        }

        .message {
            max-width: 90%;
        }

        #sendButton {
            width: 75px;
        }
    }
</style>
<style>
.login-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.login-box {
    width: 360px;
    max-width: 90%;
    background: #1e1e1e;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    position: relative;
    text-align: center;
}

.login-box h2 {
    color: white;
    margin-bottom: 25px;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #2b2b2b;
    color: white;
    outline: none;
}

.login-box input:focus {
    border-color: #777;
}

.auth-submit {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

.auth-submit:hover {
    background: #444;
}

.close-login {
    position: absolute;
    top: 10px;
    right: 15px;
    border: none;
    background: none;
    color: #aaa;
    font-size: 28px;
    cursor: pointer;
}

.close-login:hover {
    color: white;
}

.auth-switch {
    color: #aaa;
    font-size: 14px;
    margin-top: 20px;
}

.auth-switch button {
    border: none;
    background: none;
    color: white;
    cursor: pointer;
    text-decoration: underline;
}

#authMessage {
    min-height: 20px;
    margin: 10px 0;
    font-size: 14px;
}
</style>
</head>


<body>

    <!-- =========================
         SIDEBAR
    ========================= -->

    <div id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <b>Chat History</b>

            <button
                id="closeSidebar"
                type="button"
            >
                ✕
            </button>

        </div>


        <button
            id="sidebarNewChat"
            class="sidebar-new-chat"
            type="button"
        >
            + New Chat
        </button>


        <input
            type="text"
            id="historySearch"
            placeholder="Search chats..."
            autocomplete="off"
        >


        <button
            id="clearHistorySearch"
            type="button"
        >
            ✕ Clear Search
        </button>


        <div id="sidebarHistory"></div>

    </div>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>Normal Chat</h1>

        
        <div class="header-buttons">

    <button
        id="historyButton"
        type="button"
    >
        History
    </button>

    <button
        id="newChatButton"
        type="button"
    >
        New Chat
    </button>

     <button
    id="loginButton"
    type="button"
>
    Login
</button>
</div>
    </div>


    <!-- =========================
         CHAT
    ========================= -->

    <div
        id="chatBox"
        class="chat-box"
    ></div>


    <!-- =========================
         INPUT
    ========================= -->

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
            autocomplete="off"
        >


        <button
            id="sendButton"
            type="button"
        >
            Send
        </button>

    </div>


    <!-- LOGIN MODAL -->
<div id="loginModal" class="login-modal">
    <div class="login-box">

        <button id="closeLoginModal" class="close-login">
            ×
        </button>

        <h2 id="authTitle">Login</h2>

        <input
            type="text"
            id="authUsername"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            type="password"
            id="authPassword"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button id="authSubmit" class="auth-submit">
            Login
        </button>

        <p id="authMessage"></p>

        <p class="auth-switch">
            Don't have an account?
            <button id="switchAuth" type="button">
                Create Account
            </button>
        </p>

    </div>
</div>

    <script>

        /* =================================
           CONFIG
        ================================= */

        const API_URL = "";
const loginButton = document.getElementById("loginButton");
        const loginModal = document.getElementById("loginModal");
        const authTitle = document.getElementById("authTitle");
        const authUsername = document.getElementById("authUsername");
        const authPassword = document.getElementById("authPassword");
        const authSubmit = document.getElementById("authSubmit");
        const authMessage = document.getElementById("authMessage");
        const switchAuth = document.getElementById("switchAuth");
        const closeLoginModal = document.getElementById("closeLoginModal");

        let isSignupMode = false;
        let loggedInUsername = null;

        function updateAuthMode() {
            authTitle.textContent = isSignupMode ? "Create Account" : "Login";
            authSubmit.textContent = isSignupMode ? "Sign Up" : "Login";
            switchAuth.textContent = isSignupMode ? "Login" : "Create Account";
            document.querySelector(".auth-switch").firstChild.textContent =
                isSignupMode ? "Already have an account? " : "Don't have an account? ";
        }

        switchAuth.addEventListener("click", () => {
            isSignupMode = !isSignupMode;
            updateAuthMode();
            authMessage.textContent = "";
            authUsername.value = "";
            authPassword.value = "";
        });

        loginButton.addEventListener("click", () => {
            loginModal.style.display = "flex";
            authUsername.focus();
        });

        closeLoginModal.addEventListener("click", () => {
            loginModal.style.display = "none";
        });

        loginModal.addEventListener("click", (event) => {
            if (event.target === loginModal) loginModal.style.display = "none";
        });

        async function checkLoginStatus() {
            try {
                const response = await fetch("/me", { credentials: "include" });
                const data = await response.json();
                if (data.logged_in) {
                    loggedInUsername = data.username;
                    loginButton.textContent = data.username;
                } else {
                    loggedInUsername = null;
                    loginButton.textContent = "Login";
                }
            } catch (error) {
                console.error("Login status error:", error);
            }
        }

        authSubmit.addEventListener("click", async () => {
            const username = authUsername.value.trim();
            const password = authPassword.value;

            if (!username || !password) {
                authMessage.textContent = "Username and password required";
                return;
            }

            authSubmit.disabled = true;
            authMessage.textContent = "Please wait...";

            try {
                const endpoint = isSignupMode ? "/signup" : "/login";
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ username, password })
                });

                const contentType = response.headers.get("content-type") || "";
                const data = contentType.includes("application/json")
                    ? await response.json()
                    : { error: `Server returned ${response.status} instead of JSON` };

                if (!response.ok) {
                    authMessage.textContent = data.error || "Something went wrong";
                    return;
                }

                authMessage.textContent = isSignupMode
                    ? "Account created successfully!"
                    : "Login successful!";

                await checkLoginStatus();

                setTimeout(() => {
                    loginModal.style.display = "none";
                    authUsername.value = "";
                    authPassword.value = "";
                    authMessage.textContent = "";
                    loadCurrentChat();
                }, 500);
            } catch (error) {
                console.error("Auth error:", error);
                authMessage.textContent = "Server connection error";
            } finally {
                authSubmit.disabled = false;
            }
        });

        checkLoginStatus();

        /* =================================
           VARIABLES
        ================================= */

        let conversationHistory = [];


        const messageInput =
            document.getElementById("message");

        const sendButton =
            document.getElementById("sendButton");

        const chatBox =
            document.getElementById("chatBox");

        const newChatButton =
            document.getElementById("newChatButton");

        const historyButton =
            document.getElementById("historyButton");

        const sidebar =
            document.getElementById("sidebar");

        const closeSidebar =
            document.getElementById("closeSidebar");

        const sidebarNewChat =
            document.getElementById("sidebarNewChat");

        const sidebarHistory =
            document.getElementById("sidebarHistory");

        const historySearch =
            document.getElementById("historySearch");

        const clearHistorySearch =
            document.getElementById("clearHistorySearch");


        /* =================================
           ESCAPE HTML
        ================================= */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        /* =================================
           SAVE CURRENT CHAT
        ================================= */

        function saveCurrentChat() {

            localStorage.setItem(
                "normalChatCurrent",
                JSON.stringify(conversationHistory)
            );
        }


        /* =================================
           LOAD CURRENT CHAT
        ================================= */

        function loadCurrentChat() {

            const savedChat =
                localStorage.getItem(
                    "normalChatCurrent"
                );

            if (!savedChat) {
                return;
            }

            try {

                const parsed =
                    JSON.parse(savedChat);

                if (!Array.isArray(parsed)) {
                    conversationHistory = [];
                    return;
                }

                conversationHistory = parsed;

                chatBox.innerHTML = "";

                conversationHistory.forEach(
                    function (msg) {

                        addMessageToScreen(
                            msg.role,
                            msg.content
                        );

                    }
                );

                chatBox.scrollTop =
                    chatBox.scrollHeight;

            } catch (error) {

                console.error(
                    "Current chat load error:",
                    error
                );

                conversationHistory = [];

                localStorage.removeItem(
                    "normalChatCurrent"
                );
            }
        }


        /* =================================
           ADD MESSAGE
        ================================= */

        function addMessageToScreen(
            role,
            content
        ) {

            const div =
                document.createElement("div");

            div.className =
                "message " +
                (
                    role === "user"
                        ? "user"
                        : "bot"
                );

            const name =
                role === "user"
                    ? "You"
                    : "Normal Chat";

            div.innerHTML = `
                <b>${name}:</b><br>
                ${escapeHtml(content)}
            `;

            chatBox.appendChild(div);
        }


        /* =================================
           SEND MESSAGE
        ================================= */

        async function sendMessage() {

            const message =
                messageInput.value.trim();

            if (!message) {
                return;
            }


            sendButton.disabled = true;


            /* USER MESSAGE */

            conversationHistory.push({
                role: "user",
                content: message
            });

            addMessageToScreen(
                "user",
                message
            );

            messageInput.value = "";

            saveCurrentChat();


            /* TYPING */

            const thinking =
                document.createElement("div");

            thinking.className =
                "message bot";

            thinking.id =
                "thinking";

            thinking.innerHTML = `
                <b>Normal Chat:</b><br>

                <span class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            `;

            chatBox.appendChild(thinking);

            chatBox.scrollTop =
                chatBox.scrollHeight;


            try {

                const response =
                    await fetch(
                        `${API_URL}/chat`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message: message,
                                history:
                                    conversationHistory
                            })
                        }
                    );


                const data =
                    await response.json();


                if (thinking) {
                    thinking.remove();
                }


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Backend error"
                    );
                }


                const reply =
                    String(data.reply || "").trim();


                if (!reply) {

                    throw new Error(
                        "AI ne empty reply diya."
                    );
                }


                /* BOT MESSAGE */

                conversationHistory.push({
                    role: "assistant",
                    content: reply
                });

                addMessageToScreen(
                    "assistant",
                    reply
                );

                saveCurrentChat();


                chatBox.scrollTop =
                    chatBox.scrollHeight;


            } catch (error) {

                if (thinking) {
                    thinking.remove();
                }


                addMessageToScreen(
                    "assistant",
                    "Error: " +
                    error.message
                );


                console.error(
                    "Chat error:",
                    error
                );

            } finally {

                sendButton.disabled = false;

                messageInput.focus();
            }
        }


        /* =================================
           NEW CHAT
        ================================= */
        async function newChat() {
    try {

        const response = await fetch(
            `${API_URL}/new-chat`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    history: conversationHistory
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "New Chat error"
            );
        }

        conversationHistory = [];

        localStorage.removeItem(
            "normalChatCurrent"
        );

        chatBox.innerHTML = "";

        messageInput.value = "";

        sidebar.classList.remove(
            "open"
        );

        messageInput.focus();

    } catch (error) {

        console.error(
            "New Chat error:",
            error
        );

        alert(
            "New Chat nahi bana: " +
            error.message
        );
    }
}
        
        

        /* =================================
           SHOW SIDEBAR
        ================================= */

        async function showSidebar() {

            sidebar.classList.add("open");

            sidebarHistory.innerHTML =
                "<p>Loading...</p>";


            try {

                const response =
                    await fetch(
                        `${API_URL}/history`
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "History load failed"
                    );
                }


                sidebarHistory.innerHTML = "";


                if (
                    !Array.isArray(data.history) ||
                    data.history.length === 0
                ) {

                    sidebarHistory.innerHTML =
                        "<p>No chats yet.</p>";

                    return;
                }


                /*
                 * Latest chat first.
                 */

                data.history
                    .slice()
                    .reverse()
                    .forEach(
                        function (chat, reverseIndex) {

                            /*
                             * IMPORTANT:
                             * This is the real index
                             * inside backend history.
                             */

                            const realIndex =
                                data.history.length -
                                1 -
                                reverseIndex;


                            createHistoryItem(
                                chat,
                                realIndex
                            );

                        }
                    );


            } catch (error) {

                sidebarHistory.innerHTML =
                    `<p>${escapeHtml(
                        error.message
                    )}</p>`;


                console.error(
                    "History error:",
                    error
                );
            }
        }


        /* =================================
           CREATE HISTORY ITEM
        ================================= */

        function createHistoryItem(
            chat,
            realIndex
        ) {

            const item =
                document.createElement("div");

            item.className =
                "sidebar-chat";


            const messages =
                Array.isArray(chat.messages)
                    ? chat.messages
                    : [];


            const firstMessage =
                messages.find(
                    function (msg) {

                        return (
                            msg &&
                            msg.role === "user"
                        );

                    }
                );


            const defaultTitle =
                firstMessage &&
                firstMessage.content
                    ? firstMessage.content
                    : "New Chat";


            const currentTitle =
                chat.title &&
                String(chat.title).trim()
                    ? chat.title
                    : defaultTitle;


            /* =================================
               TITLE
            ================================= */

            const title =
                document.createElement("span");

            title.className =
                "sidebar-chat-title";

            title.textContent =
                currentTitle;


            /* =================================
               ACTIONS
            ================================= */

            const actions =
                document.createElement("div");

            actions.className =
                "sidebar-actions";


            /* RENAME */

            const renameButton =
                document.createElement("button");

            renameButton.type =
                "button";

            renameButton.className =
                "sidebar-rename";

            renameButton.title =
                "Rename";

            renameButton.textContent =
                "✏️";


            /* DELETE */

            const deleteButton =
                document.createElement("button");

            deleteButton.type =
                "button";

            deleteButton.className =
                "sidebar-delete";

            deleteButton.title =
                "Delete";

            deleteButton.textContent =
                "🗑️";


            actions.appendChild(
                renameButton
            );

            actions.appendChild(
                deleteButton
            );


            item.appendChild(
                title
            );

            item.appendChild(
                actions
            );


            /* =================================
               OPEN CHAT
            ================================= */

            item.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(
                            ".sidebar-chat"
                        )
                        .forEach(
                            function (chatItem) {

                                chatItem.classList
                                    .remove(
                                        "active"
                                    );
                            }
                        );


                    item.classList.add(
                        "active"
                    );


                    openHistoryChat(
                        chat
                    );


                    sidebar.classList.remove(
                        "open"
                    );
                }
            );


            /* =================================
               RENAME
            ================================= */

            renameButton.addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();

                    event.stopPropagation();


                    const newName =
                        prompt(
                            "Chat ka naya naam:",
                            currentTitle
                        );


                    if (newName === null) {
                        return;
                    }


                    const trimmedName =
                        newName.trim();


                    if (!trimmedName) {

                        alert(
                            "Naam empty nahi ho sakta."
                        );

                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/history/${realIndex}/rename`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        name: trimmedName
                                    })
                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                result.error ||
                                "Rename failed"
                            );
                        }


                        await showSidebar();


                    } catch (error) {

                        console.error(
                            "Rename error:",
                            error
                        );


                        alert(
                            "Rename nahi hua: " +
                            error.message
                        );
                    }
                }
            );


            /* =================================
               DELETE
            ================================= */

            deleteButton.addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();

                    event.stopPropagation();


                    const confirmDelete =
                        confirm(
                            "Kya ye chat delete karni hai?"
                        );


                    if (!confirmDelete) {
                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/history/${realIndex}`,
                                {
                                    method: "DELETE"
                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                result.error ||
                                "Delete failed"
                            );
                        }


                        await showSidebar();


                    } catch (error) {

                        console.error(
                            "Delete error:",
                            error
                        );


                        alert(
                            "Chat delete nahi hui: " +
                            error.message
                        );
                    }
                }
            );


            sidebarHistory.appendChild(
                item
            );
        }


        /* =================================
           OPEN OLD CHAT
        ================================= */

        function openHistoryChat(chat) {

            conversationHistory =
                Array.isArray(chat.messages)
                    ? chat.messages
                    : [];


            chatBox.innerHTML = "";


            conversationHistory.forEach(
                function (message) {

                    if (
                        !message ||
                        !message.role
                    ) {
                        return;
                    }


                    addMessageToScreen(
                        message.role,
                        message.content || ""
                    );
                }
            );


            saveCurrentChat();


            chatBox.scrollTop =
                chatBox.scrollHeight;
        }


        /* =================================
           SEARCH HISTORY
        ================================= */

        historySearch.addEventListener(
            "input",
            function () {

                const searchText =
                    historySearch.value
                        .toLowerCase()
                        .trim();


                document
                    .querySelectorAll(
                        ".sidebar-chat"
                    )
                    .forEach(
                        function (chatItem) {

                            const text =
                                chatItem.innerText
                                    .toLowerCase();


                            chatItem.style.display =
                                text.includes(
                                    searchText
                                )
                                    ? "flex"
                                    : "none";
                        }
                    );
            }
        );


        /* =================================
           CLEAR SEARCH
        ================================= */

        clearHistorySearch.addEventListener(
            "click",
            function () {

                historySearch.value = "";


                document
                    .querySelectorAll(
                        ".sidebar-chat"
                    )
                    .forEach(
                        function (chatItem) {

                            chatItem.style.display =
                                "flex";
                        }
                    );
            }
        );


        /* =================================
           BUTTON EVENTS
        ================================= */

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        newChatButton.addEventListener(
            "click",
            newChat
        );


        sidebarNewChat.addEventListener(
            "click",
            newChat
        );


        historyButton.addEventListener(
            "click",
            showSidebar
        );


        closeSidebar.addEventListener(
            "click",
            function () {

                sidebar.classList.remove(
                    "open"
                );
            }
        );


        /* =================================
           ENTER KEY
        ================================= */

        messageInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();
                }
            }
        );


        /* =================================
           START
        ================================= */

        loadCurrentChat();

        messageInput.focus();

    </script>

</body>

</html>
