<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Normal Chat AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #fff;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 72px;
            width: 100%;
            background: #111;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            color: #fff;
            font-size: 24px;
            font-weight: 600;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header button {
            border: 1px solid #333;
            background: #1b1b1b;
            color: #eee;
            padding: 10px 15px;
            border-radius: 9px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .header button:hover {
            background: #292929;
            border-color: #444;
        }

        .header button:active {
            transform: scale(0.97);
        }

        #loginButton {
            background: #f1f1f1;
            color: #111;
            border-color: #f1f1f1;
            font-weight: 600;
        }

        #loginButton:hover {
            background: #fff;
        }

        /* =========================
           CHAT BOX
        ========================= */

        .chat-box {
            height: calc(100vh - 144px);
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px;
            background: #000 !important;
            color: #fff !important;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #000;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            width: fit-content;
            max-width: 78%;
            margin-bottom: 16px;
            padding: 13px 16px;
            border-radius: 14px;
            line-height: 1.55;
            font-size: 15px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message b {
            font-size: 13px;
            opacity: 0.85;
        }

        .user {
            margin-left: auto;
            margin-right: 0;
            background: #262626;
            color: #fff;
            border: 1px solid #333;
            border-bottom-right-radius: 5px;
        }

        .bot {
            margin-left: 0;
            margin-right: auto;
            background: #151515;
            color: #f5f5f5;
            border: 1px solid #252525;
            border-bottom-left-radius: 5px;
        }

        /* =========================
           TYPING
        ========================= */

        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: #888;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            height: 72px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: #000 !important;
            border-top: 1px solid #1f1f1f;
        }

        #message {
            flex: 1;
            min-width: 0;
            height: 50px;
            border: 1px solid #333;
            border-radius: 13px;
            padding: 0 16px;
            font-size: 16px;
            outline: none;
            background: #171717 !important;
            color: #fff !important;
        }

        #message::placeholder {
            color: #777;
        }

        #message:focus {
            border-color: #555;
            background: #1b1b1b !important;
        }

        #sendButton {
            height: 50px;
            width: 82px;
            min-width: 82px;
            border: 1px solid #333;
            border-radius: 13px;
            background: #f1f1f1;
            color: #111;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #fff;
        }

        #sendButton:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 370px;
            max-width: 90vw;
            height: 100vh;
            padding: 18px;
            background: #111;
            color: #fff;
            border-right: 1px solid #2a2a2a;
            box-shadow: 10px 0 35px rgba(0, 0, 0, 0.45);
            z-index: 2000;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            overflow-y: auto;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            font-size: 21px;
        }

        #closeSidebar {
            width: 36px;
            height: 36px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1b1b1b;
            color: #bbb;
            font-size: 21px;
            cursor: pointer;
        }

        #closeSidebar:hover {
            background: #292929;
            color: #fff;
        }

        .sidebar-new-chat {
            width: 100%;
            padding: 13px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #f1f1f1;
            color: #111;
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
        }

        #historySearch {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #333;
            border-radius: 10px;
            outline: none;
            margin-bottom: 8px;
            font-size: 14px;
            background: #1a1a1a;
            color: #fff;
        }

        #historySearch::placeholder {
            color: #777;
        }

        #clearHistorySearch {
            width: 100%;
            height: 40px;
            border: 1px solid #333;
            border-radius: 9px;
            background: #1a1a1a;
            color: #bbb;
            cursor: pointer;
            margin-bottom: 15px;
        }

        #sidebarHistory > p {
            color: #777;
            font-size: 14px;
            padding: 5px;
        }

        .sidebar-chat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 11px;
            margin-bottom: 8px;
            min-height: 50px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: #1a1a1a;
            color: #ddd;
            cursor: pointer;
        }

        .sidebar-chat:hover {
            background: #242424;
            border-color: #333;
        }

        .sidebar-chat.active {
            background: #292929;
            border-color: #444;
            color: #fff;
        }

        .sidebar-chat-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .sidebar-actions {
            display: flex;
            gap: 3px;
        }

        .sidebar-rename,
        .sidebar-delete {
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            border-radius: 7px;
        }

        .sidebar-rename:hover,
        .sidebar-delete:hover {
            background: #333;
            color: #fff;
        }

        /* =========================
           LOGIN MODAL
        ========================= */

        .login-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 9999;
        }

        .login-box {
            width: 380px;
            max-width: 100%;
            background: #151515;
            padding: 30px;
            border: 1px solid #303030;
            border-radius: 17px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
            position: relative;
            text-align: center;
        }

        .login-box h2 {
            color: #fff;
            margin: 0 0 25px;
            font-size: 23px;
        }

        .login-box input {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            margin-bottom: 13px;
            border: 1px solid #363636;
            border-radius: 9px;
            background: #202020;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .auth-submit {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 9px;
            background: #f1f1f1;
            color: #111;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-submit:disabled {
            opacity: 0.5;
        }

        .close-login {
            position: absolute;
            top: 11px;
            right: 13px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 25px;
            cursor: pointer;
        }

        .close-login:hover {
            background: #292929;
            color: #fff;
        }

        .auth-switch {
            color: #888;
            font-size: 14px;
        }

        .auth-switch button {
            border: none;
            background: none;
            color: #fff;
            cursor: pointer;
            text-decoration: underline;
        }

        #authMessage {
            min-height: 20px;
            color: #bbb;
        }

        /* =========================
           SETTINGS MODAL
        ========================= */

        .settings-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 9998;
        }

        .settings-box {
            width: 420px;
            max-width: 100%;
            background: #151515;
            border: 1px solid #303030;
            border-radius: 17px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
            position: relative;
        }

        .settings-box h2 {
            margin: 0 0 25px;
            font-size: 23px;
        }

        .settings-section {
            background: #1c1c1c;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .settings-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .settings-username {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        .logout-button {
            width: 100%;
            height: 46px;
            border: 1px solid #444;
            border-radius: 9px;
            background: #242424;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .logout-button:hover {
            background: #303030;
        }

        .close-settings {
            position: absolute;
            top: 11px;
            right: 13px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 25px;
            cursor: pointer;
        }

        .close-settings:hover {
            background: #292929;
            color: #fff;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                height: 64px;
                padding: 0 9px;
            }

            .header h1 {
                font-size: 19px;
            }

            .header-buttons {
                gap: 4px;
            }

            .header button {
                padding: 8px;
                font-size: 11px;
            }

            .chat-box {
                height: calc(100vh - 128px);
                padding: 13px 9px;
            }

            .message {
                max-width: 92%;
                padding: 10px 12px;
                font-size: 14px;
            }

            .input-area {
                height: 64px;
                padding: 8px;
            }

            #message {
                height: 48px;
                font-size: 15px;
            }

            #sendButton {
                width: 65px;
                min-width: 65px;
                height: 48px;
                font-size: 13px;
            }

            .sidebar {
                width: 88vw;
                max-width: 340px;
            }

            .settings-box {
                width: calc(100vw - 30px);
                padding: 25px 18px;
            }
        }

        @media (max-width: 380px) {

            .header h1 {
                font-size: 17px;
            }

            .header button {
                padding: 7px 6px;
                font-size: 10px;
            }

            #sendButton {
                width: 58px;
                min-width: 58px;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->

    <div id="sidebar" class="sidebar">

        <div class="sidebar-header">
            <b>Chat History</b>

            <button id="closeSidebar" type="button">✕</button>
        </div>

        <button id="sidebarNewChat" class="sidebar-new-chat" type="button">
            + New Chat
        </button>

        <input
            type="text"
            id="historySearch"
            placeholder="Search chats..."
            autocomplete="off"
        >

        <button id="clearHistorySearch" type="button">
            ✕ Clear Search
        </button>

        <div id="sidebarHistory"></div>

    </div>


    <!-- HEADER -->

    <div class="header">

        <h1>Normal Chat</h1>

        <div class="header-buttons">

            <button id="historyButton" type="button">
                History
            </button>

            <button id="newChatButton" type="button">
                New Chat
            </button>

            <button id="settingsButton" type="button">
                ⚙️
            </button>

            <button id="loginButton" type="button">
                Login
            </button>

        </div>

    </div>


    <!-- CHAT -->

    <div id="chatBox" class="chat-box"></div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button id="sendButton" type="button">
            Send
        </button>

    </div>


    <!-- LOGIN MODAL -->

    <div id="loginModal" class="login-modal">

        <div class="login-box">

            <button id="closeLoginModal" class="close-login" type="button">
                ×
            </button>

            <h2 id="authTitle">Login</h2>

            <input
                type="text"
                id="authUsername"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                type="password"
                id="authPassword"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="authSubmit" class="auth-submit" type="button">
                Login
            </button>

            <p id="authMessage"></p>

            <p class="auth-switch">
                Don't have an account?
                <button id="switchAuth" type="button">
                    Create Account
                </button>
            </p>

        </div>

    </div>


    <!-- SETTINGS MODAL -->

    <div id="settingsModal" class="settings-modal">

        <div class="settings-box">

            <button
                id="closeSettings"
                class="close-settings"
                type="button"
            >
                ×
            </button>

            <h2>Settings</h2>

            <div class="settings-section">

                <div class="settings-label">
                    Logged in as
                </div>

                <div
                    id="settingsUsername"
                    class="settings-username"
                >
                    Not logged in
                </div>

            </div>

            <div class="settings-section">

                <div class="settings-label">
                    Account
                </div>

                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>


    <script>

        /* =========================
           CONFIG
        ========================= */

        const API_URL = "";


        /* =========================
           AUTH ELEMENTS
        ========================= */

        const loginButton =
            document.getElementById("loginButton");

        const loginModal =
            document.getElementById("loginModal");

        const authTitle =
            document.getElementById("authTitle");

        const authUsername =
            document.getElementById("authUsername");

        const authPassword =
            document.getElementById("authPassword");

        const authSubmit =
            document.getElementById("authSubmit");

        const authMessage =
            document.getElementById("authMessage");

        const switchAuth =
            document.getElementById("switchAuth");

        const closeLoginModal =
            document.getElementById("closeLoginModal");


        /* =========================
           SETTINGS ELEMENTS
        ========================= */

        const settingsButton =
            document.getElementById("settingsButton");

        const settingsModal =
            document.getElementById("settingsModal");

        const closeSettings =
            document.getElementById("closeSettings");

        const settingsUsername =
            document.getElementById("settingsUsername");

        const logoutButton =
            document.getElementById("logoutButton");


        let isSignupMode = false;

        let loggedInUsername = null;


        /* =========================
           AUTH MODE
        ========================= */

        function updateAuthMode() {

            authTitle.textContent =
                isSignupMode
                    ? "Create Account"
                    : "Login";

            authSubmit.textContent =
                isSignupMode
                    ? "Sign Up"
                    : "Login";

            switchAuth.textContent =
                isSignupMode
                    ? "Login"
                    : "Create Account";

            document.querySelector(".auth-switch").firstChild.textContent =
                isSignupMode
                    ? "Already have an account? "
                    : "Don't have an account? ";
        }


        switchAuth.addEventListener(
            "click",
            () => {

                isSignupMode =
                    !isSignupMode;

                updateAuthMode();

                authMessage.textContent = "";

                authUsername.value = "";

                authPassword.value = "";
            }
        );


        /* =========================
           LOGIN MODAL
        ========================= */

        loginButton.addEventListener(
            "click",
            () => {

                if (loggedInUsername) {

                    settingsUsername.textContent =
                        loggedInUsername;

                    settingsModal.style.display =
                        "flex";

                    return;
                }

                loginModal.style.display =
                    "flex";

                authUsername.focus();
            }
        );


        closeLoginModal.addEventListener(
            "click",
            () => {

                loginModal.style.display =
                    "none";
            }
        );


        loginModal.addEventListener(
            "click",
            (event) => {

                if (event.target === loginModal) {

                    loginModal.style.display =
                        "none";
                }
            }
        );


        /* =========================
           SETTINGS
        ========================= */

        settingsButton.addEventListener(
            "click",
            () => {

                if (!loggedInUsername) {

                    loginModal.style.display =
                        "flex";

                    authUsername.focus();

                    return;
                }

                settingsUsername.textContent =
                    loggedInUsername;

                settingsModal.style.display =
                    "flex";
            }
        );


        closeSettings.addEventListener(
            "click",
            () => {

                settingsModal.style.display =
                    "none";
            }
        );


        settingsModal.addEventListener(
            "click",
            (event) => {

                if (event.target === settingsModal) {

                    settingsModal.style.display =
                        "none";
                }
            }
        );


        /* =========================
           LOGOUT
        ========================= */

        logoutButton.addEventListener(
            "click",
            async () => {

                const confirmLogout =
                    confirm("Kya aap logout karna chahte ho?");

                if (!confirmLogout) {
                    return;
                }

                try {

                    const response =
                        await fetch(
                            "/logout",
                            {
                                method: "POST",
                                credentials: "include"
                            }
                        );

                    const contentType =
                        response.headers.get(
                            "content-type"
                        ) || "";

                    const data =
                        contentType.includes(
                            "application/json"
                        )
                            ? await response.json()
                            : {};

                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "Logout failed"
                        );
                    }

                    loggedInUsername = null;

                    loginButton.textContent =
                        "Login";

                    settingsModal.style.display =
                        "none";

                    conversationHistory = [];

                    chatBox.innerHTML = "";

                    localStorage.removeItem(
                        "normalChatCurrent"
                    );

                    alert("Logout successful!");

                } catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                    alert(
                        "Logout nahi hua: " +
                        error.message
                    );
                }
            }
        );


        /* =========================
           CHECK LOGIN
        ========================= */

        async function checkLoginStatus() {

            try {

                const response =
                    await fetch(
                        "/me",
                        {
                            credentials: "include"
                        }
                    );

                const data =
                    await response.json();


                if (data.logged_in) {

                    loggedInUsername =
                        data.username;

                    loginButton.textContent =
                        data.username;

                    settingsUsername.textContent =
                        data.username;

                    loadCurrentChat();

                } else {

                    loggedInUsername = null;

                    loginButton.textContent =
                        "Login";

                    settingsUsername.textContent =
                        "Not logged in";
                }

            } catch (error) {

                console.error(
                    "Login status error:",
                    error
                );
            }
        }


        /* =========================
           LOGIN / SIGNUP
        ========================= */

        authSubmit.addEventListener(
            "click",
            async () => {

                const username =
                    authUsername.value.trim();

                const password =
                    authPassword.value;


                if (!username || !password) {

                    authMessage.textContent =
                        "Username and password required";

                    return;
                }


                authSubmit.disabled =
                    true;

                authMessage.textContent =
                    "Please wait...";


                try {

                    const endpoint =
                        isSignupMode
                            ? "/signup"
                            : "/login";


                    const response =
                        await fetch(
                            endpoint,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "include",

                                body: JSON.stringify({
                                    username,
                                    password
                                })
                            }
                        );


                    const contentType =
                        response.headers.get(
                            "content-type"
                        ) || "";


                    const data =
                        contentType.includes(
                            "application/json"
                        )
                            ? await response.json()
                            : {
                                error:
                                    `Server returned ${response.status} instead of JSON`
                            };


                    if (!response.ok) {

                        authMessage.textContent =
                            data.error ||
                            "Something went wrong";

                        return;
                    }


                    authMessage.textContent =
                        isSignupMode
                            ? "Account created successfully!"
                            : "Login successful!";


                    await checkLoginStatus();


                    setTimeout(
                        () => {

                            loginModal.style.display =
                                "none";

                            authUsername.value = "";

                            authPassword.value = "";

                            authMessage.textContent = "";

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Auth error:",
                        error
                    );

                    authMessage.textContent =
                        "Server connection error";

                } finally {

                    authSubmit.disabled =
                        false;
                }
            }
        );


        /* =========================
           VARIABLES
        ========================= */

        let conversationHistory = [];

        let isStreaming = false;


        const messageInput =
            document.getElementById("message");

        const sendButton =
            document.getElementById("sendButton");

        const chatBox =
            document.getElementById("chatBox");

        const newChatButton =
            document.getElementById("newChatButton");

        const historyButton =
            document.getElementById("historyButton");

        const sidebar =
            document.getElementById("sidebar");

        const closeSidebar =
            document.getElementById("closeSidebar");

        const sidebarNewChat =
            document.getElementById("sidebarNewChat");

        const sidebarHistory =
            document.getElementById("sidebarHistory");

        const historySearch =
            document.getElementById("historySearch");

        const clearHistorySearch =
            document.getElementById("clearHistorySearch");


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        /* =========================
           SAVE CURRENT CHAT
        ========================= */

        function saveCurrentChat() {

            localStorage.setItem(
                "normalChatCurrent",
                JSON.stringify(conversationHistory)
            );
        }


        /* =========================
           LOAD CURRENT CHAT
        ========================= */

        function loadCurrentChat() {

            const savedChat =
                localStorage.getItem(
                    "normalChatCurrent"
                );


            if (!savedChat) {
                return;
            }


            try {

                const parsed =
                    JSON.parse(savedChat);


                if (!Array.isArray(parsed)) {

                    conversationHistory = [];

                    return;
                }


                conversationHistory =
                    parsed;


                chatBox.innerHTML = "";


                conversationHistory.forEach(
                    function (msg) {

                        addMessageToScreen(
                            msg.role,
                            msg.content
                        );

                    }
                );


                chatBox.scrollTop =
                    chatBox.scrollHeight;


            } catch (error) {

                console.error(
                    "Current chat load error:",
                    error
                );


                conversationHistory = [];


                localStorage.removeItem(
                    "normalChatCurrent"
                );
            }
        }


        /* =========================
           ADD MESSAGE
        ========================= */

        function addMessageToScreen(
            role,
            content
        ) {

            const div =
                document.createElement("div");


            div.className =
                "message " +
                (
                    role === "user"
                        ? "user"
                        : "bot"
                );


            const name =
                role === "user"
                    ? "You"
                    : "Normal Chat";


            div.innerHTML = `
                <b>${name}:</b><br>
                ${escapeHtml(content)}
            `;


            chatBox.appendChild(div);

            return div;
        }


        /* =========================
           CREATE STREAMING MESSAGE
        ========================= */

        function createStreamingMessage() {

            const div =
                document.createElement("div");

            div.className =
                "message bot";

            div.innerHTML = `
                <b>Normal Chat:</b><br>
                <span class="streaming-text"></span>
            `;

            chatBox.appendChild(div);

            return div;
        }


        /* =========================
           SEND MESSAGE
        ========================= */

        async function sendMessage() {

            if (isStreaming) {
                return;
            }


            const message =
                messageInput.value.trim();


            if (!message) {
                return;
            }


            if (!loggedInUsername) {

                loginModal.style.display =
                    "flex";

                authUsername.focus();

                return;
            }


            isStreaming = true;

            sendButton.disabled = true;

            messageInput.disabled = true;


            conversationHistory.push({
                role: "user",
                content: message
            });


            addMessageToScreen(
                "user",
                message
            );


            messageInput.value = "";

            saveCurrentChat();


            const thinking =
                document.createElement("div");


            thinking.className =
                "message bot";

            thinking.id =
                "thinking";


            thinking.innerHTML = `
                <b>Normal Chat:</b><br>
                <span class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            `;


            chatBox.appendChild(thinking);

            chatBox.scrollTop =
                chatBox.scrollHeight;


            try {

                const response =
                    await fetch(
                        `${API_URL}/chat`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                message: message,
                                history:
                                    conversationHistory
                            })
                        }
                    );


                /*
                 * Login / normal JSON error
                 */
                const contentType =
                    response.headers.get(
                        "content-type"
                    ) || "";


                if (
                    !response.ok &&
                    contentType.includes(
                        "application/json"
                    )
                ) {

                    const errorData =
                        await response.json();

                    throw new Error(
                        errorData.error ||
                        "Backend error"
                    );
                }


                if (!response.ok) {

                    throw new Error(
                        `Server returned ${response.status}`
                    );
                }


                /*
                 * Remove thinking dots
                 */

                if (thinking) {
                    thinking.remove();
                }


                /*
                 * Streaming message
                 */

                const streamingMessage =
                    createStreamingMessage();


                const streamingText =
                    streamingMessage.querySelector(
                        ".streaming-text"
                    );


                /*
                 * Get stream
                 */

                if (!response.body) {

                    throw new Error(
                        "Streaming response available nahi hai."
                    );
                }


                const reader =
                    response.body.getReader();


                const decoder =
                    new TextDecoder(
                        "utf-8"
                    );


                let buffer = "";

                let fullReply = "";


                while (true) {

                    const {
                        value,
                        done
                    } = await reader.read();


                    if (done) {
                        break;
                    }


                    buffer += decoder.decode(
                        value,
                        {
                            stream: true
                        }
                    );


                    const events =
                        buffer.split(
                            "\n\n"
                        );


                    buffer =
                        events.pop() || "";


                    for (
                        const event
                        of events
                    ) {

                        const lines =
                            event.split("\n");


                        for (
                            const line
                            of lines
                        ) {

                            if (
                                !line.startsWith(
                                    "data:"
                                )
                            ) {
                                continue;
                            }


                            const jsonText =
                                line
                                    .slice(5)
                                    .trim();


                            if (!jsonText) {
                                continue;
                            }


                            let payload;


                            try {

                                payload =
                                    JSON.parse(
                                        jsonText
                                    );

                            } catch (parseError) {

                                console.error(
                                    "Stream JSON parse error:",
                                    parseError
                                );

                                continue;
                            }


                            /*
                             * Text chunk
                             */

                            if (
                                payload.type ===
                                "chunk"
                            ) {

                                const chunk =
                                    String(
                                        payload.text ||
                                        ""
                                    );


                                fullReply +=
                                    chunk;


                                streamingText.textContent =
                                    fullReply;


                                chatBox.scrollTop =
                                    chatBox.scrollHeight;
                            }


                            /*
                             * Stream completed
                             */

                            if (
                                payload.type ===
                                "done"
                            ) {

                                console.log(
                                    "Streaming completed."
                                );
                            }
                        }
                    }
                }


                /*
                 * Save final answer
                 */

                fullReply =
                    fullReply.trim();


                if (!fullReply) {

                    streamingMessage.remove();

                    throw new Error(
                        "AI ne empty reply diya."
                    );
                }


                conversationHistory.push({
                    role: "assistant",
                    content: fullReply
                });


                saveCurrentChat();


                chatBox.scrollTop =
                    chatBox.scrollHeight;


            } catch (error) {

                if (thinking) {
                    thinking.remove();
                }


                /*
                 * Only add error if no normal
                 * streaming response exists.
                 */

                addMessageToScreen(
                    "assistant",
                    "Error: " +
                    error.message
                );


                console.error(
                    "Chat error:",
                    error
                );

            } finally {

                isStreaming = false;

                sendButton.disabled = false;

                messageInput.disabled = false;

                messageInput.focus();
            }
        }


        /* =========================
           NEW CHAT
        ========================= */

        async function newChat() {

            if (isStreaming) {
                return;
            }


            if (!loggedInUsername) {

                loginModal.style.display =
                    "flex";

                authUsername.focus();

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/new-chat`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                history:
                                    conversationHistory
                            })
                        }
                    );


                const contentType =
                    response.headers.get(
                        "content-type"
                    ) || "";


                const data =
                    contentType.includes(
                        "application/json"
                    )
                        ? await response.json()
                        : {
                            error:
                                `Server returned ${response.status}`
                        };


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "New Chat error"
                    );
                }


                conversationHistory = [];


                localStorage.removeItem(
                    "normalChatCurrent"
                );


                chatBox.innerHTML = "";

                messageInput.value = "";


                sidebar.classList.remove(
                    "open"
                );


                messageInput.focus();


            } catch (error) {

                console.error(
                    "New Chat error:",
                    error
                );


                alert(
                    "New Chat nahi bana: " +
                    error.message
                );
            }
        }


        /* =========================
           SHOW SIDEBAR
        ========================= */

        async function showSidebar() {

            if (isStreaming) {
                return;
            }


            if (!loggedInUsername) {

                loginModal.style.display =
                    "flex";

                authUsername.focus();

                return;
            }


            sidebar.classList.add(
                "open"
            );


            sidebarHistory.innerHTML =
                "<p>Loading...</p>";


            try {

                const response =
                    await fetch(
                        `${API_URL}/history`,
                        {
                            credentials: "include"
                        }
                    );


                const contentType =
                    response.headers.get(
                        "content-type"
                    ) || "";


                const data =
                    contentType.includes(
                        "application/json"
                    )
                        ? await response.json()
                        : {
                            error:
                                `Server returned ${response.status}`
                        };


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "History load failed"
                    );
                }


                sidebarHistory.innerHTML =
                    "";


                if (
                    !Array.isArray(
                        data.history
                    ) ||
                    data.history.length === 0
                ) {

                    sidebarHistory.innerHTML =
                        "<p>No chats yet.</p>";

                    return;
                }


                data.history
                    .slice()
                    .reverse()
                    .forEach(
                        function (
                            chat,
                            reverseIndex
                        ) {

                            const realIndex =
                                data.history.length -
                                1 -
                                reverseIndex;


                            createHistoryItem(
                                chat,
                                realIndex
                            );

                        }
                    );


            } catch (error) {

                sidebarHistory.innerHTML =
                    `<p>${escapeHtml(
                        error.message
                    )}</p>`;


                console.error(
                    "History error:",
                    error
                );
            }
        }


        /* =========================
           CREATE HISTORY ITEM
        ========================= */

        function createHistoryItem(
            chat,
            realIndex
        ) {

            const item =
                document.createElement("div");


            item.className =
                "sidebar-chat";


            const messages =
                Array.isArray(
                    chat.messages
                )
                    ? chat.messages
                    : [];


            const firstMessage =
                messages.find(
                    function (msg) {

                        return (
                            msg &&
                            msg.role === "user"
                        );

                    }
                );


            const defaultTitle =
                firstMessage &&
                firstMessage.content
                    ? firstMessage.content
                    : "New Chat";


            const currentTitle =
                chat.title &&
                String(chat.title).trim()
                    ? chat.title
                    : defaultTitle;


            const title =
                document.createElement(
                    "span"
                );


            title.className =
                "sidebar-chat-title";


            title.textContent =
                currentTitle;


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "sidebar-actions";


            const renameButton =
                document.createElement(
                    "button"
                );


            renameButton.type =
                "button";

            renameButton.className =
                "sidebar-rename";

            renameButton.title =
                "Rename";

            renameButton.textContent =
                "✏️";


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.type =
                "button";

            deleteButton.className =
                "sidebar-delete";

            deleteButton.title =
                "Delete";

            deleteButton.textContent =
                "🗑️";


            actions.appendChild(
                renameButton
            );

            actions.appendChild(
                deleteButton
            );

            item.appendChild(title);

            item.appendChild(actions);


            item.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(
                            ".sidebar-chat"
                        )
                        .forEach(
                            function (chatItem) {

                                chatItem.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    item.classList.add(
                        "active"
                    );


                    openHistoryChat(chat);


                    sidebar.classList.remove(
                        "open"
                    );
                }
            );


            renameButton.addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();

                    event.stopPropagation();


                    const newName =
                        prompt(
                            "Chat ka naya naam:",
                            currentTitle
                        );


                    if (newName === null) {
                        return;
                    }


                    const trimmedName =
                        newName.trim();


                    if (!trimmedName) {

                        alert(
                            "Naam empty nahi ho sakta."
                        );

                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/history/${realIndex}/rename`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    credentials: "include",

                                    body: JSON.stringify({
                                        name:
                                            trimmedName
                                    })
                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                result.error ||
                                "Rename failed"
                            );
                        }


                        await showSidebar();


                    } catch (error) {

                        alert(
                            "Rename nahi hua: " +
                            error.message
                        );
                    }
                }
            );


            deleteButton.addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();

                    event.stopPropagation();


                    const confirmDelete =
                        confirm(
                            "Kya ye chat delete karni hai?"
                        );


                    if (!confirmDelete) {
                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/history/${realIndex}`,
                                {
                                    method: "DELETE",
                                    credentials: "include"
                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                result.error ||
                                "Delete failed"
                            );
                        }


                        await showSidebar();


                    } catch (error) {

                        alert(
                            "Chat delete nahi hui: " +
                            error.message
                        );
                    }
                }
            );


            sidebarHistory.appendChild(item);
        }


        /* =========================
           OPEN OLD CHAT
        ========================= */

        function openHistoryChat(chat) {

            conversationHistory =
                Array.isArray(
                    chat.messages
                )
                    ? chat.messages
                    : [];


            chatBox.innerHTML = "";


            conversationHistory.forEach(
                function (message) {

                    if (
                        !message ||
                        !message.role
                    ) {
                        return;
                    }


                    addMessageToScreen(
                        message.role,
                        message.content || ""
                    );
                }
            );


            saveCurrentChat();


            chatBox.scrollTop =
                chatBox.scrollHeight;
        }


        /* =========================
           SEARCH
        ========================= */

        historySearch.addEventListener(
            "input",
            function () {

                const searchText =
                    historySearch.value
                        .toLowerCase()
                        .trim();


                document
                    .querySelectorAll(
                        ".sidebar-chat"
                    )
                    .forEach(
                        function (chatItem) {

                            const text =
                                chatItem.innerText
                                    .toLowerCase();


                            chatItem.style.display =
                                text.includes(searchText)
                                    ? "flex"
                                    : "none";
                        }
                    );
            }
        );


        clearHistorySearch.addEventListener(
            "click",
            function () {

                historySearch.value = "";

                document
                    .querySelectorAll(
                        ".sidebar-chat"
                    )
                    .forEach(
                        function (chatItem) {

                            chatItem.style.display =
                                "flex";
                        }
                    );
            }
        );


        /* =========================
           BUTTON EVENTS
        ========================= */

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        newChatButton.addEventListener(
            "click",
            newChat
        );


        sidebarNewChat.addEventListener(
            "click",
            newChat
        );


        historyButton.addEventListener(
            "click",
            showSidebar
        );


        closeSidebar.addEventListener(
            "click",
            function () {

                sidebar.classList.remove(
                    "open"
                );
            }
        );


        /* =========================
           ENTER KEY
        ========================= */

        messageInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();
                }
            }
        );


        /* =========================
           START
        ========================= */

        checkLoginStatus();

        messageInput.focus();

    </script>

</body>

</html>
